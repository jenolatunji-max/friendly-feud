/* =========================================================
   Friendly Feud styles
   Palette: midnight navy, stage blue, electric blue,
   showtime gold, cream, strike red.
   ========================================================= */
:root {
  --navy: #0A1238;
  --navy-2: #0E1746;
  --panel: #121C4E;
  --panel-2: #18256A;
  --stage: #1C3FAA;
  --elec: #2F6BFF;
  --gold: #F6B93B;
  --gold-d: #B57B12;
  --cream: #FFF6E0;
  --red: #E63946;
  --red-d: #C1121F;
  --muted: #C9CEE8;
  --line: rgba(255, 246, 224, 0.16);
  --field: #0E1746;
  --field-b: #3A4C8C;
  --ok: #3DDC97;
  --warn: #FFD166;
  --bad: #FF8A93;
  --fs: 16px;
  --display: 'Anton', Impact, 'Arial Narrow Bold', 'Arial Narrow', sans-serif;
  --body: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --tscale: 1;
  color-scheme: dark;
}
html[data-text="large"] { --fs: 18px; --tscale: 1.1; }
html[data-text="xl"] { --fs: 21px; --tscale: 1.2; }
html.hc {
  --navy: #000000; --navy-2: #000000; --panel: #000000; --panel-2: #0B0B0B; --stage: #0030B0;
  --muted: #FFFFFF; --line: #FFFFFF; --field: #000000; --field-b: #FFFFFF; --gold: #FFD23F;
}
*, *::before, *::after { box-sizing: border-box; }
html { font-size: var(--fs); }
body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--navy);
  background-image: radial-gradient(ellipse 80% 55% at 50% -12%, rgba(47, 107, 255, 0.38), transparent 70%), radial-gradient(ellipse 50% 40% at 50% 110%, rgba(246, 185, 59, 0.10), transparent 70%);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--body);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
html.hc body { background-image: none; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 400; letter-spacing: 0.02em; line-height: 1.1; margin: 0 0 0.4em; }
h1 { font-size: 2.4rem; }
h2 { font-size: 1.55rem; color: var(--gold); }
h3 { font-size: 1.2rem; }
h1:focus { outline: none; }
p { margin: 0 0 0.75em; }
a { color: var(--gold); }
kbd {
  display: inline-block; min-width: 1.6em; padding: 0.05em 0.45em; border-radius: 6px;
  background: rgba(255, 246, 224, 0.12); border: 1px solid rgba(255, 246, 224, 0.3); border-bottom-width: 2px;
  font: 600 0.85em/1.4 var(--body); color: inherit; text-align: center;
}
.muted, .hint { color: var(--muted); }
.hint { font-size: 0.92rem; }
.ok { color: var(--ok); }
.warn { color: var(--warn); }
.bad { color: var(--bad); }
.note { padding: 0.8em 1em; border-radius: 12px; background: rgba(47, 107, 255, 0.16); border: 1px solid rgba(47, 107, 255, 0.5); margin: 0.75em 0; }
.note.warn { background: rgba(255, 209, 102, 0.12); border-color: rgba(255, 209, 102, 0.5); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.45em;
  font: 650 1rem/1.15 var(--body); padding: 0.7em 1.15em; border-radius: 12px;
  border: 2px solid transparent; cursor: pointer; color: var(--cream); background: var(--stage);
  transition: transform 0.08s ease, background-color 0.15s ease, box-shadow 0.15s ease;
  text-decoration: none; white-space: nowrap;
}
.btn:hover { background: #2549BF; }
.btn:active { transform: translateY(1px) scale(0.99); }
.btn:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, a:focus-visible {
  outline: 3px solid var(--gold); outline-offset: 3px;
}
.btn svg { width: 1.15em; height: 1.15em; flex: none; }
.btn-gold { background: var(--gold); color: var(--navy); }
.btn-gold:hover { background: #FFC85A; }
.btn-red { background: var(--red-d); color: #fff; }
.btn-red:hover { background: #D61F2D; }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-ghost:hover { background: rgba(255, 246, 224, 0.08); }
.btn-sm { font-size: 0.86rem; padding: 0.45em 0.8em; border-radius: 9px; }
.btn-big { font-size: 1.12rem; padding: 0.8em 1.4em; }
.btn-xl {
  font-family: var(--display); font-weight: 400; font-size: 2.6rem; letter-spacing: 0.06em; text-transform: uppercase;
  padding: 0.3em 1.8em; border-radius: 18px;
  box-shadow: 0 0 0 5px rgba(246, 185, 59, 0.22), 0 14px 40px rgba(246, 185, 59, 0.28);
}
.btn-icon { padding: 0.5em; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn kbd { font-size: 0.75em; background: rgba(0, 0, 0, 0.18); border-color: rgba(0, 0, 0, 0.25); }
.btn-team { background: var(--tc); color: var(--navy); font-weight: 750; }
.btn-team:hover { filter: brightness(1.08); background: var(--tc); }
html.hc .btn { border-color: #fff; }
html.hc .btn-gold, html.hc .btn-team { border-color: var(--navy); }
.btn-row { display: flex; flex-wrap: wrap; gap: 0.6em; align-items: center; margin: 0.75em 0; }
.btn-row.small { margin-top: 0.5em; }

/* ---------- Forms ---------- */
input[type="text"], input[type="number"], select, textarea {
  font: inherit; color: var(--cream); background: var(--field); border: 2px solid var(--field-b);
  border-radius: 10px; padding: 0.55em 0.7em; width: 100%;
}
input[type="number"] { max-width: 9em; }
textarea { resize: vertical; line-height: 1.4; }
input:focus, select:focus, textarea:focus { border-color: var(--gold); }
input::placeholder, textarea::placeholder { color: #8E97C4; }
input[type="checkbox"], input[type="radio"] { width: 1.15em; height: 1.15em; accent-color: var(--gold); vertical-align: -0.15em; }
input[type="range"] { width: 100%; accent-color: var(--gold); }
.fld { display: flex; flex-direction: column; gap: 0.35em; font-weight: 600; margin-bottom: 0.8em; }
.fld > span { font-weight: 600; }
.radio, .toggle { display: flex; align-items: center; gap: 0.55em; font-weight: 500; padding: 0.3em 0; cursor: pointer; }
fieldset { border: 0; margin: 0; }
legend { font-family: var(--display); font-size: 1.4rem; color: var(--gold); padding: 0; margin-bottom: 0.5em; float: left; width: 100%; }
legend + * { clear: both; }

/* ---------- Layout ---------- */
.page { max-width: 1100px; margin: 0 auto; padding: 24px 24px 72px; }
.page.wide { max-width: 1380px; }
.pagehead { display: flex; align-items: flex-start; gap: 1em; margin: 0.5em 0 1.2em; }
.pagehead h1 { margin: 0; }
.pagehead .sub { color: var(--muted); margin: 0.2em 0 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 20px 22px; margin-bottom: 18px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 18px; }
.grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 18px; align-items: end; }
.actions-bar { display: flex; justify-content: space-between; align-items: center; gap: 1em; margin-top: 1em; }
.chip { display: inline-block; padding: 0.15em 0.6em; border-radius: 99px; font-size: 0.8rem; font-weight: 700; }
.chip.gold { background: var(--gold); color: var(--navy); }

/* ---------- Toasts and modals ---------- */
#toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 200; pointer-events: none; width: min(560px, 92vw); }
.toast { background: #1B2A7A; color: var(--cream); border: 1px solid rgba(255, 246, 224, 0.25); border-left: 6px solid var(--gold); padding: 0.75em 1em; border-radius: 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); font-weight: 600; animation: toastIn 0.25s ease; }
.toast.warn { border-left-color: var(--warn); }
.toast.bad { border-left-color: var(--red); }
.toast.out { opacity: 0; transform: translateY(8px); transition: 0.3s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
.modal-wrap { position: fixed; inset: 0; background: rgba(4, 8, 30, 0.72); display: flex; align-items: center; justify-content: center; z-index: 150; padding: 16px; animation: fadeIn 0.15s ease; }
.modal { background: var(--panel); border: 2px solid var(--gold); border-radius: 20px; padding: 26px 28px; width: min(520px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5); }
.modal.wide { width: min(820px, 100%); }
.modal h2 { color: var(--cream); font-size: 1.9rem; }
.modal-actions { display: flex; justify-content: flex-end; gap: 0.6em; margin-top: 1.2em; flex-wrap: wrap; }
@keyframes fadeIn { from { opacity: 0; } }

/* ---------- Home ---------- */
.home { max-width: 1040px; margin: 0 auto; padding: 3vh 24px 48px; text-align: center; display: flex; flex-direction: column; align-items: center; }
.home-logo { width: min(540px, 86vw); margin: 0 auto -0.5em; filter: drop-shadow(0 14px 40px rgba(47, 107, 255, 0.35)); }
.logo-svg { display: block; width: 100%; height: auto; }
.tagline { font-size: 1.3rem; max-width: 36em; margin: 0.6em auto 1.3em; color: var(--cream); }
.qp-sub { color: var(--muted); margin: 0.9em 0 0.4em; }
.resume-btn { margin-bottom: 0.5em; }
.home-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; width: 100%; margin-top: 1.6em; }
.home-grid button {
  text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; color: var(--cream);
  cursor: pointer; font: inherit; display: flex; flex-direction: column; gap: 0.2em; transition: transform 0.12s, border-color 0.12s, background 0.12s;
}
.home-grid button:hover { border-color: var(--gold); background: var(--panel-2); transform: translateY(-2px); }
.home-grid b { font-family: var(--display); font-weight: 400; font-size: 1.45rem; letter-spacing: 0.03em; color: var(--gold); }
.home-grid small { color: var(--muted); font-size: 0.92rem; }

/* ---------- Pack chips, swatches ---------- */
.pchips { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 0.8em 0; text-align: left; }
.pchip { display: flex; gap: 0.6em; align-items: flex-start; padding: 0.7em 0.85em; border-radius: 12px; border: 2px solid var(--field-b); cursor: pointer; background: var(--navy-2); }
.pchip:has(input:checked) { border-color: var(--gold); background: rgba(246, 185, 59, 0.1); }
.pchip span { display: flex; flex-direction: column; }
.pchip small { color: var(--muted); font-size: 0.82rem; }
.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.sw { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; font-size: 0.8rem; }
.sw input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.sw span { width: 44px; height: 44px; border-radius: 50%; background: var(--c); border: 3px solid transparent; box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.25); }
.sw input:checked + span { border-color: var(--cream); box-shadow: 0 0 0 3px var(--gold); }
.sw input:focus-visible + span { outline: 3px solid var(--gold); outline-offset: 3px; }
.sw em { font-style: normal; color: var(--muted); }
.team-f { margin-bottom: 18px; }

/* ---------- Steps, tabs ---------- */
.steps { list-style: none; display: flex; gap: 8px; padding: 0; margin: 0 0 18px; flex-wrap: wrap; }
.steps li, .steps li button { display: flex; align-items: center; gap: 0.5em; font: 600 0.95rem var(--body); color: var(--muted); }
.steps li { padding: 0.5em 0.9em; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); }
.steps.clickable li { padding: 0; }
.steps li button { background: none; border: 0; padding: 0.5em 0.9em; cursor: pointer; border-radius: 99px; }
.steps li span { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--panel-2); color: var(--cream); font-size: 0.85em; }
.steps li.cur { border-color: var(--gold); color: var(--cream); }
.steps li.cur button { color: var(--cream); }
.steps li.cur span { background: var(--gold); color: var(--navy); }
.steps li.done span { background: var(--ok); color: var(--navy); }
.tabs, .qtabs { display: flex; gap: 6px; flex-wrap: wrap; margin: 0.4em 0 1em; }
.tabs button, .qtabs button { font: 600 0.95rem var(--body); color: var(--cream); background: var(--navy-2); border: 2px solid var(--field-b); border-radius: 10px; padding: 0.5em 0.9em; cursor: pointer; }
.tabs button[aria-selected="true"], .qtabs button[aria-selected="true"] { background: var(--gold); color: var(--navy); border-color: var(--gold); }

/* ---------- Settings ---------- */
.sound-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 24px; }
.sound-row { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 0.25em 0; border-bottom: 1px solid var(--line); }
.keyset { display: flex; align-items: center; gap: 0.8em; padding: 0.4em 0; }
.keyset span { min-width: 8em; font-weight: 600; }
.keyset kbd { font-size: 1rem; padding: 0.3em 0.7em; min-width: 7em; }
.keyset kbd.listening { background: var(--gold); color: var(--navy); }
.kbd-table { border-collapse: collapse; width: 100%; }
.kbd-table td { padding: 0.45em 0.6em; border-bottom: 1px solid var(--line); }
.kbd-table td:first-child { width: 13em; }

/* ---------- Help ---------- */
.help ol { padding-left: 1.3em; }
.help li { margin-bottom: 0.55em; }
.toc { display: flex; flex-wrap: wrap; gap: 0.4em 1.2em; position: sticky; top: 8px; z-index: 5; }
.toc a { font-weight: 600; text-decoration: none; }
.toc a:hover { text-decoration: underline; }
.faq dt { font-weight: 700; margin-top: 0.8em; color: var(--gold); }
.faq dd { margin: 0.2em 0 0; }

/* ---------- Setup Check ---------- */
.ck-body { min-height: 300px; }
.ck-body h2 { font-size: 2rem; color: var(--cream); }
.status { font-weight: 600; min-height: 1.5em; }
.status svg, .ready-list svg { width: 1.2em; height: 1.2em; vertical-align: -0.2em; }
.buzz-test { display: flex; gap: 18px; margin: 1em 0; }
.bz { flex: 1; max-width: 260px; padding: 22px; border-radius: 16px; border: 3px dashed var(--field-b); text-align: center; display: flex; flex-direction: column; gap: 0.3em; }
.bz b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; }
.bz.on { border-style: solid; border-color: var(--ok); background: rgba(61, 220, 151, 0.12); }
.ready { text-align: center; padding: 1em 0; }
.ready h2 { color: var(--ok) !important; font-size: 2.6rem !important; }
.ready-list { list-style: none; padding: 0; display: inline-flex; flex-direction: column; gap: 0.5em; text-align: left; font-size: 1.15rem; margin: 0.5em auto 1em; }
.ready-list .ok { color: var(--ok); }
.ready-list .skip { color: var(--muted); }
.ready .btn-row { justify-content: center; }
.dash { display: inline-block; width: 1.2em; text-align: center; }

/* ---------- Tour ---------- */
.tour { position: fixed; inset: 0; z-index: 140; }
.tour-hole { position: fixed; border-radius: 18px; box-shadow: 0 0 0 9999px rgba(4, 8, 30, 0.72); border: 3px solid var(--gold); transition: all 0.25s ease; pointer-events: none; }
.tour-tip { position: fixed; width: 340px; background: var(--cream); color: var(--navy); border-radius: 16px; padding: 18px 20px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
.tour-tip h3 { color: var(--navy); font-size: 1.5rem; }
.tour-tip .btn-ghost { color: var(--navy); border-color: rgba(10, 18, 56, 0.35); }
.tour-tip .btn-row { justify-content: flex-end; margin-bottom: 0; }

/* ---------- Editor ---------- */
.ed { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 18px; align-items: start; }
.ed-list { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; padding: 16px; }
.ed-list ul { list-style: none; padding: 0; margin: 0.5em 0 0; display: flex; flex-direction: column; gap: 4px; }
.ed-p { width: 100%; text-align: left; background: transparent; border: 2px solid transparent; color: var(--cream); padding: 0.55em 0.7em; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; font: inherit; }
.ed-p:hover { background: var(--panel-2); }
.ed-p.sel { border-color: var(--gold); background: rgba(246, 185, 59, 0.08); }
.ed-p small { color: var(--muted); font-size: 0.8rem; }
.ro h3 { font-family: var(--body); font-weight: 700; font-size: 1.05rem; letter-spacing: 0; }
.ro-ans { margin: 0; padding-left: 1.4em; columns: 2; column-gap: 24px; }
.ro-ans li { break-inside: avoid; margin-bottom: 0.3em; }
.ro-ans small { display: block; color: var(--muted); font-size: 0.8rem; }
.pts-chip { display: inline-block; background: var(--gold); color: var(--navy); font-weight: 800; border-radius: 6px; padding: 0 0.4em; font-size: 0.85em; }
.red-head { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
.red-n { font-family: var(--display); font-size: 1.6rem; color: var(--gold); min-width: 1.4em; }
.red-q { font-weight: 700; }
.red-tools { display: flex; gap: 6px; }
.red-t { width: 100%; border-collapse: collapse; }
.red-t th { text-align: left; font-size: 0.8rem; color: var(--muted); font-weight: 600; padding: 0 6px 4px; }
.red-t td { padding: 3px 6px; }
.red-t td:first-child { width: 2em; color: var(--muted); text-align: center; }
.red-t td:nth-child(3) { width: 7em; }
.red-t td:last-child { width: 6em; }
.red-foot { display: flex; align-items: center; gap: 1em; margin-top: 10px; flex-wrap: wrap; }
.total { font-weight: 700; }
.total.bad { color: var(--bad); }
.warns { display: flex; gap: 0.8em; flex-wrap: wrap; font-size: 0.9rem; }

/* ---------- Your Crowd ---------- */
.hero-card { background: linear-gradient(135deg, #1C3FAA, #121C4E 60%); border-color: rgba(246, 185, 59, 0.5); }
.hero-card h2 { color: var(--cream); font-size: 2rem; max-width: 24em; }
.cr-list { list-style: none; padding: 0; margin: 0; }
.cr-list li { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 6px 0; }
.cr-open { flex: 1; text-align: left; background: none; border: 0; color: var(--cream); font: inherit; cursor: pointer; padding: 0.5em; border-radius: 8px; display: flex; flex-direction: column; }
.cr-open:hover { background: var(--panel-2); }
.cr-open small { color: var(--muted); }
.tpl { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1em; }
.cr-qs { padding-left: 1.6em; display: flex; flex-direction: column; gap: 8px; }
.cr-qs li { padding-left: 0.3em; }
.cr-qs li > * { vertical-align: middle; }
.cr-qs input { width: calc(100% - 7em); margin-right: 0.5em; }
#cr-msg { font-family: var(--body); }
.how { padding-left: 1.3em; }
.table-scroll { overflow: auto; max-height: 50vh; border: 1px solid var(--line); border-radius: 12px; }
.pv-t { border-collapse: collapse; width: 100%; }
.pv-t th { position: sticky; top: 0; background: var(--panel-2); padding: 6px; font-size: 0.85rem; z-index: 1; }
.pv-t td { padding: 3px; }
.pv-t input[type="text"] { min-width: 8em; padding: 0.35em 0.5em; font-size: 0.9rem; }
.pv-t td:first-child { text-align: center; }
.map-t td { padding: 4px 8px; }
.big-stat { font-size: 1.15rem; }
.big-stat b { font-family: var(--display); font-weight: 400; font-size: 2.4rem; color: var(--gold); margin-right: 0.15em; }
.sugg { background: rgba(246, 185, 59, 0.1); border: 1px solid rgba(246, 185, 59, 0.45); border-radius: 12px; padding: 12px 14px; margin: 0.5em 0 1em; }
.sugg h3 { color: var(--gold); }
.sugg-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; flex-wrap: wrap; }
.sugg-row span { flex: 1; min-width: 14em; }
.groups { list-style: none; padding: 0; margin: 0; }
.groups li { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-bottom: 1px solid var(--line); }
.groups li.top .g-count { background: var(--gold); color: var(--navy); }
.g-name { background: none; border: 0; color: var(--cream); font: 700 1.02rem var(--body); cursor: pointer; text-align: left; padding: 0.2em 0.3em; border-radius: 6px; min-width: 10em; }
button.g-name:hover { background: var(--panel-2); text-decoration: underline; }
.g-count { display: inline-grid; place-items: center; min-width: 2.2em; height: 2.2em; border-radius: 8px; background: var(--panel-2); font-weight: 800; }
.g-raw { flex: 1; color: var(--muted); font-size: 0.85rem; }
.cr-boards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 0 18px; }
.cr-board h3 { font-family: var(--body); font-weight: 700; font-size: 1.05rem; letter-spacing: 0; }
.mini-board { list-style: none; counter-reset: mb; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 5px; }
.mini-board li { counter-increment: mb; display: flex; align-items: center; gap: 8px; background: var(--stage); border-radius: 8px; padding: 0.4em 0.6em; font-family: var(--display); font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.03em; }
.mini-board li::before { content: counter(mb); display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--gold); color: var(--navy); font-size: 0.85em; }
.mini-board span { flex: 1; }
.mini-board b { background: var(--gold); color: var(--navy); font-weight: 400; min-width: 2.2em; text-align: center; border-radius: 6px; padding: 0 0.3em; }

/* =========================================================
   Host desk
   ========================================================= */
body[data-screen="game"] { overflow: hidden; }
.desk { height: 100vh; display: flex; flex-direction: column; }
.desk-top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: rgba(10, 18, 56, 0.85); flex-wrap: wrap; }
.desk-brand { font-family: var(--display); font-size: 1.35rem; color: var(--gold); letter-spacing: 0.05em; text-transform: uppercase; }
.d-round { display: flex; align-items: center; gap: 10px; font-size: 1rem; }
.d-round .muted { font-size: 0.9rem; }
.d-conn { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.92rem; margin-left: auto; }
.dot { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
.dot.ok { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.dot.bad { background: var(--red); box-shadow: 0 0 10px var(--red); }
.desk-actions { display: flex; gap: 6px; }
.d-tip { display: flex; align-items: center; justify-content: space-between; gap: 1em; padding: 8px 16px; background: rgba(47, 107, 255, 0.2); border-bottom: 1px solid rgba(47, 107, 255, 0.5); font-size: 0.92rem; }
.desk-main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(360px, 1fr); gap: 16px; padding: 14px 16px; }
.desk-left, .desk-right { min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.d-question { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; }
.q-k { display: block; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); font-weight: 700; }
.q-t { display: block; font-size: 1.45rem; font-weight: 750; line-height: 1.2; }
.d-answers { display: flex; flex-direction: column; gap: 6px; }
.arow {
  display: grid; grid-template-columns: 2.4em minmax(0, 1fr) auto 3.2em; align-items: center; gap: 12px;
  text-align: left; background: var(--stage); color: var(--cream); border: 2px solid #3F66E0; border-radius: 12px;
  padding: 0.45em 0.7em; cursor: pointer; font: inherit; min-height: 3.1em; transition: background 0.12s, transform 0.08s;
}
.arow:hover { background: #2549BF; }
.arow:active { transform: scale(0.995); }
.arow .anum { display: grid; place-items: center; width: 2em; height: 2em; border-radius: 50%; background: var(--gold); color: var(--navy); font: 400 1.2rem var(--display); }
.arow .atext b { display: block; font-size: 1.12rem; }
.arow .atext small { display: block; color: #DDE3FF; font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.arow .apts { font: 400 1.5rem var(--display); background: var(--gold); color: var(--navy); border-radius: 8px; text-align: center; padding: 0.05em 0; }
.arow .astate { font-size: 0.78rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ok); }
.arow.on { background: #0F1F5C; border-color: #2B3C7E; }
.arow.on .atext b { text-decoration: line-through; text-decoration-color: rgba(255, 246, 224, 0.5); color: #B9C2EA; }
.arow.on .anum, .arow.on .apts { background: #4C5A8F; color: #E3E7F7; }
.arow.free .astate { color: var(--muted); }
.guess { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 14px; }
.guess label { font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); }
.guess input { margin-top: 4px; }
.guess-out { min-height: 1.4em; font-weight: 600; margin-top: 4px; font-size: 0.95rem; }
.d-phase { margin: 0; padding: 16px 18px; border-color: rgba(246, 185, 59, 0.5); }
.d-phase h3 { font-size: 1.7rem; color: var(--gold); }
.d-phase p { margin-bottom: 0.4em; }
.strikes { display: flex; gap: 8px; margin: 0.4em 0; }
.sx { display: grid; place-items: center; width: 2.2em; height: 2.2em; border-radius: 10px; border: 2px dashed rgba(255, 246, 224, 0.3); font: 400 1.4rem var(--display); color: rgba(255, 246, 224, 0.25); }
.sx.on { background: var(--red-d); border: 2px solid #fff; color: #fff; }
.potline { display: flex; align-items: baseline; gap: 10px; margin-top: 0.4em; }
.potline span { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.potline b { font: 400 2rem var(--display); color: var(--gold); }
.potline em { font-style: normal; font-weight: 700; color: var(--cream); }
.d-teams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tcard { background: var(--tc); color: var(--navy); border-radius: 16px; padding: 10px 12px; text-align: center; }
.tcard .tname { font-weight: 800; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcard .tscore { font: 400 2.6rem/1 var(--display); margin: 2px 0 6px; }
.tadj { display: flex; justify-content: center; gap: 4px; }
.tcard .btn-ghost { color: var(--navy); border-color: rgba(10, 18, 56, 0.4); background: rgba(255, 255, 255, 0.25); padding: 0.3em 0.6em; }
.tcard .btn-ghost:hover { background: rgba(255, 255, 255, 0.45); }
.d-tools { display: flex; flex-wrap: wrap; gap: 6px; }

/* Lightning desk */
.l-qs { display: flex; flex-direction: column; gap: 4px; position: relative; padding-top: 1.4em; }
.lq-head { position: absolute; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 2em minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; padding: 0 0.6em; }
.lq { display: grid; grid-template-columns: 2em minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 8px; align-items: center; text-align: left; background: var(--panel); color: var(--cream); border: 2px solid var(--line); border-radius: 10px; padding: 0.45em 0.6em; font: inherit; cursor: pointer; }
.lq.cur { border-color: var(--gold); background: rgba(246, 185, 59, 0.12); }
.lq-n { font: 400 1.2rem var(--display); color: var(--gold); }
.lq-t { font-weight: 600; font-size: 0.95rem; }
.lq-a { font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lq-a b { color: var(--gold); }
.lq-a i { color: var(--muted); }
.l-cur { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.l-cur:empty { display: none; }
.lc-q { font-size: 1.35rem; font-weight: 750; margin-bottom: 8px; }
.lc-ans { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px; }
.lc-b { justify-content: space-between; text-align: left; white-space: normal; }
.lc-b b { background: var(--gold); color: var(--navy); border-radius: 6px; padding: 0 0.4em; }
.lc-b.taken { opacity: 0.55; outline: 2px dashed var(--red); }
.l-row { display: flex; gap: 6px; margin-top: 4px; }
.l-row input { flex: 1; }

.bd-grid { position: relative; height: 100%; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(4, minmax(0, 1fr)); grid-auto-flow: column; gap: calc(var(--u) * 1.1) calc(var(--u) * 1.5); }

.bd-foot { display: flex; align-items: center; justify-content: center; gap: calc(var(--u) * 2); min-height: calc(var(--u) * 4.6); }

.bd-team { align-self: center; display: flex; flex-direction: column; align-items: center; text-align: center; background: linear-gradient(180deg, var(--tc), var(--tc)); color: var(--navy); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 1.8) calc(var(--u) * 1); border: calc(var(--u) * 0.35) solid rgba(255, 246, 224, 0.85); box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0, 0, 0, 0.45); transition: box-shadow 0.3s, transform 0.3s; position: relative; }

#confetti { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 120; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .home-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ed { grid-template-columns: 1fr; }
  .ed-list { position: static; max-height: none; }
  .desk-actions .btn span { display: none; }
}
@media (max-width: 760px) {
  .grid2, .grid4, .sound-list { grid-template-columns: 1fr; }
  .home-grid { grid-template-columns: 1fr; }
  .desk-main { grid-template-columns: 1fr; }
}
@media (max-height: 760px) {
  .arow { min-height: 2.75em; padding: 0.3em 0.7em; }
  .arow .atext small { font-size: 0.75rem; }
  .q-t { font-size: 1.3rem; }
  .d-phase h3 { font-size: 1.45rem; }
  .tcard .tscore { font-size: 2.1rem; }
  .home { padding-top: 1vh; }
  .home-logo { width: min(420px, 80vw); }
  .btn-xl { font-size: 2.2rem; }
  .home-grid { margin-top: 1em; }
  .home-grid button { padding: 12px 16px; }
}

/* ---------- Reduced motion ---------- */
html.rm *, html.rm *::before, html.rm *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}
html.rm .bd-strikes.show .xmark { animation: none; opacity: 1; }
@media (prefers-reduced-motion: reduce) { .bd-strikes.show .xmark { animation: none; opacity: 1; } }

/* ---------- Print: host cards on US Letter ---------- */
#print-root { display: none; }
@media print {
  @page { size: letter; margin: 0.5in; }
  html, body { background: #fff !important; color: #000 !important; }
  #app, #toasts, .modal-wrap, #confetti, .tour { display: none !important; }
  #print-root { display: block; font-family: Arial, Helvetica, sans-serif; color: #000; }
  .p-head { display: flex; justify-content: space-between; border-bottom: 3px solid #000; padding-bottom: 6px; margin-bottom: 12px; font-size: 12pt; }
  .p-head b { font-family: var(--display); font-weight: 400; font-size: 18pt; letter-spacing: 0.04em; text-transform: uppercase; }
  .pcard { border: 2px solid #000; border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; break-inside: avoid; page-break-inside: avoid; }
  .pcard h3 { font-family: Arial, Helvetica, sans-serif; font-weight: 700; font-size: 14pt; margin: 0 0 6px; letter-spacing: 0; }
  .pcard table { width: 100%; border-collapse: collapse; font-size: 11pt; }
  .pcard td { padding: 3px 6px; border-top: 1px solid #bbb; vertical-align: top; }
  .pcard .pn { width: 1.6em; font-weight: 700; }
  .pcard .pts { text-align: right; font-weight: 700; width: 3em; font-size: 13pt; }
  .pcard .acc { color: #333; font-size: 9pt; }
}

/* ---------- Host script, answer timer ---------- */
.say { background: rgba(246, 185, 59, 0.12); border-left: 4px solid var(--gold); border-radius: 8px; padding: 0.45em 0.7em; font-style: italic; font-size: 1.02rem; }
.say span { font-style: normal; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); margin-right: 0.6em; }
.clock-tools { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px 2px 10px; border: 1px solid var(--line); border-radius: 10px; }
.clock-tools .muted { font-size: 0.85rem; font-weight: 600; margin-right: 2px; }
.bd-clock { --pct: 100%; display: none; place-items: center; flex: none; width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: 50%; background: conic-gradient(var(--gold) var(--pct), rgba(255, 246, 224, 0.15) 0); padding: calc(var(--u) * 0.45); }
.bd-clock b { display: grid; place-items: center; width: 100%; height: 100%; border-radius: 50%; background: var(--navy); font-weight: 400; font-size: calc(var(--u) * 3); color: var(--cream); }
.bd-clock.on { display: grid; }
.bd-clock.low { background: conic-gradient(var(--red) var(--pct), rgba(255, 246, 224, 0.15) 0); }

/* ---------- Text helpers for judging ---------- */
const STOP_WORDS = new Set(['the', 'a', 'an', 'my', 'your', 'some', 'their', 'his', 'her']);
function singular(w) {
  // movie/movies, city/cities, pie/pies all reduce to the same stem
  if (/ies$/.test(w) && w.length >= 4) return w.slice(0, -3) + 'i';
  if (/ie$/.test(w) && w.length >= 3) return w.slice(0, -2) + 'i';
  if (w.length <= 3) return w;
  if (/[^aeiou]y$/.test(w)) return w.slice(0, -1) + 'i';
  if (/(ss|us|is|ous)$/.test(w)) return w;
  if (/(ches|shes|xes|zes|sses)$/.test(w)) return w.slice(0, -2);
  if (/s$/.test(w)) return w.slice(0, -1);

function normalizeAnswer(s) {
  let t = String(s == null ? '' : s).toLowerCase();
  try { t = t.normalize('NFKD').replace(/[̀-ͯ]/g, ''); } catch (e) { /* ignore */ }
  t = t.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}\u{1F1E6}-\u{1F1FF}]/gu, ' ');
  t = t.replace(/&/g, ' and ').replace(/['’`]/g, '').replace(/[^a-z0-9 ]+/g, ' ');

}
function levenshtein(a, b) {
  if (a === b) return 0;
  if (!a.length) return b.length;
  if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));

}

  const g = normalizeAnswer(guess);

  let bestScore = 0;
  answers.forEach((a, i) => {
    const keys = [a.text].concat(a.accept || []).map(normalizeAnswer).filter(Boolean);

/* ---------- Modal dialogs ---------- */
function modal(opts) {

  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';

      <h2 id="mdl-t">${esc(title)}</h2>

    </div>`;
    const prevFocus = document.activeElement;
    document.body.appendChild(wrap);

      if (done) return;
      done = true;
      wrap.remove();
      document.removeEventListener('keydown', onKey, true);
      try { prevFocus && prevFocus.focus && prevFocus.focus(); } catch (e) { /* ignore */ }
      resolve(v);

      const b = e.target.closest('[data-mi]');

        const a = actions[+b.dataset.mi];
        if (a.validate && !a.validate(wrap)) return;
        close(a.value !== undefined ? a.value : +b.dataset.mi);

function download(name, data, mime = 'application/json') {

/* =========================================================

   ========================================================= */
function logoSVG(brand, opts) {
  opts = opts || {};

    const outer = i % 2 === 0;
    const rx = outer ? 296 : 252;
    const ry = outer ? 148 : 118;
    pts += (cx + Math.cos(a) * rx).toFixed(1) + ',' + (cy + Math.sin(a) * ry).toFixed(1) + ' ';
  }
  // Ticket with notches on the short sides
  const ticket = 'M84,62 H516 a22,22 0 0 1 22,22 V126 a24,24 0 0 0 0,48 V216 a22,22 0 0 1 -22,22 H84 a22,22 0 0 1 -22,-22 V174 a24,24 0 0 0 0,-48 V84 a22,22 0 0 1 22,-22 Z';
  let bulbs = '';
  const bx0 = 96;
  const bx1 = 504;
  const n = 15;
  for (let i = 0; i <= n; i++) {
    const x = bx0 + ((bx1 - bx0) * i) / n;
    bulbs += `<circle class="lg-b" cx="${x.toFixed(1)}" cy="78" r="5.2"/><circle class="lg-b" cx="${x.toFixed(1)}" cy="222" r="5.2"/>`;
  }

    ? `<text x="300" y="138" text-anchor="middle" font-family="${fam}" font-size="56" letter-spacing="5" fill="#0A1238">${line1}</text>`
    : '';
  const y2 = line1 ? 206 : 178;
  const fs2 = line1 ? 78 : 92;
  const t2 = `<text x="300" y="${y2}" text-anchor="middle" font-family="${fam}" font-size="${fs2}" letter-spacing="7" fill="#0A1238">${line2}</text>`;
  const title = opts.title === false ? '' : `<title>${brand}</title>`;
  return `<svg class="logo-svg" viewBox="0 0 600 300" role="img" aria-label="${brand}" xmlns="http://www.w3.org/2000/svg">${title}
    <polygon points="${pts.trim()}" fill="#2F6BFF"/>
    <polygon points="${pts.trim()}" fill="#1C3FAA" transform="translate(300 150) scale(0.86) translate(-300 -150)"/>
    <path d="${ticket}" fill="#0A1238" transform="translate(0 7)" opacity="0.55"/>
    <path d="${ticket}" fill="#F6B93B" stroke="#FFF6E0" stroke-width="4"/>
    <path d="${ticket}" fill="none" stroke="#B57B12" stroke-width="2" transform="translate(300 150) scale(0.93) translate(-300 -150)"/>
    <g fill="#FFF6E0">${bulbs}</g>

}

/* ---- audio.js ---- */
/* =========================================================

   No recordings, no files, all original.
   ========================================================= */
const Sound = (() => {

    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);

    o.connect(g);
    g.connect(dest || master);
    o.start(t);
    o.stop(t + dur + 0.05);

    const g = ctx.createGain();

    f.connect(g);
    g.connect(master);
    s.start(t);

      osc('triangle', 2350, t + 0.07, 0.35, 0.05);

      osc('sawtooth', 138, t, 0.85, 0.14, null, lp);

      osc('square', 930, t + 0.1, 0.2, 0.16);
    },

function customPacks() {
  const list = Store.get('packs', []);
  return Array.isArray(list) ? list : [];
}
function saveCustomPacks(list) {
  if (!Store.set('packs', list)) toast('Could not save. Your browser storage may be full or turned off. Use Export to keep a copy.', 'bad');
}
function allPacks() {
  return BUILTIN_PACKS.map((p) => Object.assign({}, p, { builtin: true })).concat(customPacks());
}
function getPack(id) { return allPacks().find((p) => p.id === id) || null; }
function upsertCustomPack(pack) {
  const list = customPacks();
  const i = list.findIndex((p) => p.id === pack.id);
  if (i >= 0) list[i] = pack; else list.push(pack);
  saveCustomPacks(list);
}
function deleteCustomPack(id) { saveCustomPacks(customPacks().filter((p) => p.id !== id)); }
const isPlayable = (r) => !!(r && String(r.q || '').trim() && r.answers && r.answers.filter((a) => a && String(a.text || '').trim()).length >= 3);
function playableRounds(p) { return (p.rounds || []).filter(isPlayable).length; }

function cleanAnswer(a) {
  const text = String((a && a.text) || '').trim().slice(0, 40);
  let accept = a && a.accept;
  if (typeof accept === 'string') accept = accept.split(/[|;,]/);
  accept = Array.isArray(accept) ? accept.map((x) => String(x).trim()).filter(Boolean).slice(0, 20) : [];
  return { text, points: clamp(Math.round(+((a && a.points) || 0)) || 0, 0, 100), accept };
}
function cleanRound(r) {
  return {
    q: String((r && r.q) || '').trim().slice(0, 200),
    answers: ((r && r.answers) || []).map(cleanAnswer).filter((a) => a.text).slice(0, 8),
  };
}
/** Validate any incoming pack object. Throws a friendly Error if unusable. */
function validatePack(p) {
  if (!isObj(p)) throw new Error('That file is not a question pack.');
  const name = String(p.name || '').trim();
  if (!name) throw new Error('The pack needs a name.');
  const rounds = Array.isArray(p.rounds) ? p.rounds.map(cleanRound).filter((r) => r.q) : [];
  const lightning = Array.isArray(p.lightning)
    ? p.lightning.filter((s) => s && Array.isArray(s.questions)).map((s, i) => ({ name: String(s.name || 'Set ' + (i + 1)), questions: s.questions.map(cleanRound).filter((q) => q.q && q.answers.length) }))
    : [];
  if (!rounds.length && !lightning.length) throw new Error('The pack has no questions.');
  return {
    id: String(p.id || uid('pack')).replace(/[^\w-]/g, '').slice(0, 60) || uid('pack'),
    name: name.slice(0, 60),
    audience: String(p.audience || '').slice(0, 80),
    region: String(p.region || 'US').toUpperCase().slice(0, 8),
    source: p.source === 'surveyed' ? 'surveyed' : 'estimate',
    rounds,
    lightning,
  };
}
function roundWarnings(r) {
  const w = [];
  const total = r.answers.reduce((s, a) => s + (+a.points || 0), 0);
  if (r.answers.length < 3) w.push('Add at least 3 answers.');
  if (r.answers.length > 8) w.push('Only the top 8 answers fit on the board.');
  if (total > 100) w.push('Points add up to ' + total + '. Keep it at 100 or less.');
  const seen = new Set();
  r.answers.forEach((a) => {
    const k = normalizeAnswer(a.text);
    if (k && seen.has(k)) w.push('"' + a.text + '" is listed twice.');
    seen.add(k);
  });
  return w;
}

/* ---------- CSV (shared by editor and Your Crowd) ---------- */
function parseCSV(text) {
  text = String(text || '').replace(/^﻿/, '');
  const rows = [];
  let row = [];
  let f = '';
  let q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(f); rows.push(row); row = []; f = '';
    } else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
}
function csvCell(v) {
  const s = String(v == null ? '' : v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function toCSV(rows) { return rows.map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n'; }

function packToCSV(p) {
  const rows = [['q', 'answer', 'points', 'accept']];
  (p.rounds || []).forEach((r) => r.answers.forEach((a) => rows.push([r.q, a.text, a.points, (a.accept || []).join(' | ')])));
  return toCSV(rows);
}
function csvToRounds(text) {
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('That CSV file is empty.');
  let start = 0;
  let ci = { q: 0, a: 1, p: 2, acc: 3 };
  const head = rows[0].map((h) => String(h).trim().toLowerCase());
  if (head.some((h) => /^(q|question)$/.test(h)) || head.includes('answer')) {
    start = 1;
    const find = (re, d) => { const i = head.findIndex((h) => re.test(h)); return i >= 0 ? i : d; };
    ci = { q: find(/^(q|question)/, 0), a: find(/^answer/, 1), p: find(/^(points|pts|score)/, 2), acc: find(/^(accept|variation|also)/, -1) };
  }
  const rounds = [];
  let cur = null;
  for (let i = start; i < rows.length; i++) {
    const r = rows[i];
    const q = String(r[ci.q] || '').trim();
    const a = String(r[ci.a] || '').trim();
    if (!a && !q) continue;
    if (q && (!cur || cur.q !== q)) { cur = { q, answers: [] }; rounds.push(cur); }
    if (!cur) continue;
    if (a) cur.answers.push(cleanAnswer({ text: a, points: r[ci.p], accept: ci.acc >= 0 ? String(r[ci.acc] || '').split(/[|;]/) : [] }));
  }
  if (!rounds.length) throw new Error('No questions found. Use columns: q, answer, points.');
  rounds.forEach((r) => r.answers.sort((x, y) => y.points - x.points));
  return rounds;
}

function commit() {
  persistLive();
  Sync.push();
  if (typeof renderGame === 'function') renderGame();
}
/** Timer ticks: save and sync, but only redraw the numbers on the host desk. */
function commitTick() {
  persistLive();
  Sync.push();
  if (typeof renderTick === 'function') renderTick();
}
/** Run a host action. Return false from fn to cancel (nothing is recorded). */
function act(fn) {
  if (!G) return;
  const snap = JSON.stringify(G);
  const r = fn();
  if (r === false) return;
  HIST.push(snap);
  if (HIST.length > 200) HIST.shift();
  commit();
}
function undo() {
  if (!G) return;
  if (!HIST.length) { toast('Nothing to undo yet.'); return; }
  G = JSON.parse(HIST.pop());
  G.fx = { id: uid('fx'), type: 'undo' };
  if (G.lightning) G.lightning.running = false;
  Lightning.stopLoop();
  Clock.halt();
  G.clock = null;
  commit();
  toast('Undone.');
}
function fx(type, data) { G.fx = Object.assign({ id: uid('fx'), type }, data || {}); }
const other = (t) => 1 - t;
const teamName = (t) => (G && G.teams[t] ? G.teams[t].name : 'Team ' + (t + 1));

function multiplierFor(n, cfg) {
  if (cfg.tripleOn && n >= cfg.tripleRound) return 3;
  if (cfg.doubleOn && n >= cfg.doubleRound) return 2;
  return 1;
}
function buildQueue(packIds) {
  const q = [];
  packIds.forEach((id) => {
    const p = getPack(id);
    if (!p) return;
    (p.rounds || []).forEach((r, i) => { if (isPlayable(r)) q.push({ packId: id, i }); });
  });
  // Questions nobody has played yet come first, so repeat players get fresh boards.
  const played = new Set(playedList());
  const fresh = shuffle(q.filter((x) => !played.has(questionKey(x))));
  const seen = shuffle(q.filter((x) => played.has(questionKey(x))));
  return fresh.concat(seen);
}
function questionKey(ref) {
  const p = getPack(ref.packId);
  const r = p && p.rounds[ref.i];
  return ref.packId + '|' + normalizeAnswer(r ? r.q : ref.i);
}
function playedList() { const l = Store.get('played', []); return Array.isArray(l) ? l : []; }
function markPlayed(ref) {
  const k = questionKey(ref);
  const l = playedList();
  if (!l.includes(k)) { l.push(k); Store.set('played', l.slice(-3000)); }
}
function freshCount(packIds) {
  const played = new Set(playedList());
  let n = 0;
  packIds.forEach((id) => { const p = getPack(id); if (p) (p.rounds || []).forEach((r, i) => { if (isPlayable(r) && !played.has(questionKey({ packId: id, i }))) n++; }); });
  return n;
}

function newGame(cfg) {
  cfg = mergeDeep(DEFAULT_CFG, cfg);
  const queue = buildQueue(cfg.packs);
  if (!queue.length) { toast('Those packs have no playable questions. Pick another pack.', 'bad'); return false; }
  Lightning.stopLoop();
  G = {
    v: 1,
    id: uid('game'),
    phase: 'faceoff',
    cfg,
    teams: cfg.teams.map((t, i) => ({ name: String(t.name || 'Team ' + (i + 1)).slice(0, 24), color: t.color, score: 0 })),
    roundNo: 1,
    queue,
    qPtr: 0,
    round: null,
    fx: null,
    winner: null,
    lightning: null,
    tiebreak: false,
  };
  HIST = [];
  loadQuestion(false);
  fx('newround');
  Sound.play('intro');
  commit();
  return true;
}

function takeQuestion(random) {
  if (G.qPtr >= G.queue.length) { G.queue = shuffle(G.queue); G.qPtr = 0; }
  if (random) {
    const j = G.qPtr + Math.floor(Math.random() * (G.queue.length - G.qPtr));
    [G.queue[G.qPtr], G.queue[j]] = [G.queue[j], G.queue[G.qPtr]];
  }
  return G.queue[G.qPtr++];
}
function loadQuestion(random) {
  let src = null;
  let pack = null;
  for (let tries = 0; tries < G.queue.length + 1 && !src; tries++) {
    const ref = takeQuestion(random);
    pack = getPack(ref.packId);
    src = pack && pack.rounds[ref.i];
    if (src && !isPlayable(src)) src = null;
  }
  if (!src) { toast('Ran out of questions.', 'bad'); return; }
  markPlayed(G.queue[G.qPtr - 1]);
  const answers = src.answers.filter((a) => String(a.text || '').trim()).sort((a, b) => b.points - a.points).slice(0, 8)
    .map((a) => ({ text: a.text, points: +a.points || 0, accept: a.accept || [] }));
  G.round = {
    key: uid('r'),
    q: src.q,
    packName: pack.name,
    answers,
    revealed: answers.map(() => false),
    free: answers.map(() => false),
    strikes: 0,
    pot: 0,
    control: null,
    fo: { step: 'buzz', first: null, firstRank: null, secondRank: null, winner: null },
    mult: multiplierFor(Math.min(G.roundNo, G.cfg.rounds), G.cfg),
    awarded: null,
    stealer: null,
  };
  G.phase = 'faceoff';
  if (G.clock) { Clock.halt(); G.clock = null; }
}

function strikeFx(n) { fx('strike', { count: n }); Sound.play('strike'); }
function foWin(team) {
  const fo = G.round.fo;
  fo.winner = team;
  fo.step = 'playpass';
  fx('fowin', { team });
}
function awardTo(team, why) {
  const r = G.round;
  const pts = r.pot * r.mult;
  G.teams[team].score += pts;
  r.awarded = { team, pts, why };
  G.phase = 'roundEnd';
  fx('award', { team, pts, why });
  setTimeout(() => Sound.play('award'), 550);
}
function gameWillEnd() {
  if (!G) return false;
  const reached = G.teams.some((t) => t.score >= G.cfg.winScore);
  const out = G.roundNo >= G.cfg.rounds;
  return (reached || out) && G.teams[0].score !== G.teams[1].score;
}
function finishGame() {
  const [a, b] = G.teams;
  G.winner = a.score === b.score ? -1 : (a.score > b.score ? 0 : 1);
  G.phase = 'gameOver';
  Lightning.stopLoop();
  fx('win', { team: G.winner });
  setTimeout(() => Sound.play('win'), 200);
}

const Actions = {
  buzz(team) {
    if (!G || G.phase !== 'faceoff' || G.round.fo.step !== 'buzz') return;
    act(() => {
      G.round.fo.first = team;
      G.round.fo.step = 'first';
      fx('buzz', { team });
      Sound.play('buzz');
    });
  },
  reveal(i) {
    if (!G || !G.round || G.phase === 'lightning' || G.phase === 'gameOver') return;
    const r = G.round;
    if (i < 0 || i >= r.answers.length) return;
    if (r.revealed[i]) {
      toast('"' + r.answers[i].text + '" is already on the board.', 'warn');
      Sound.play('duplicate');
      return;
    }
    if (G.phase === 'faceoff') {
      if (r.fo.step === 'buzz') { toast('Who buzzed in first? Pick a team first.', 'warn'); return; }
      if (r.fo.step === 'playpass') { toast('Choose Play or Pass first.', 'warn'); return; }
      if (r.fo.step === 'hostpick') { toast('Pick which team wins the face-off first.', 'warn'); return; }
    }
    act(() => {
      r.revealed[i] = true;
      fx('reveal', { i });
      Sound.play('reveal');
      if (G.phase === 'roundEnd') { r.free[i] = true; return; }
      r.pot += r.answers[i].points;
      if (G.phase === 'faceoff') {
        const fo = r.fo;
        if (fo.step === 'first') {
          fo.firstRank = i;
          if (i === 0) foWin(fo.first); else fo.step = 'second';
        } else {
          fo.secondRank = i;
          const firstWins = fo.firstRank != null && fo.firstRank >= 0 && fo.firstRank < i;
          foWin(firstWins ? fo.first : other(fo.first));
        }
      } else if (G.phase === 'play') {
        if (r.revealed.every(Boolean)) awardTo(r.control, 'cleared');
      } else if (G.phase === 'steal') {
        awardTo(r.stealer, 'steal');
      }
    });
  },
  miss() {
    if (!G || !G.round) return;
    const r = G.round;
    if (G.phase === 'faceoff') {
      const fo = r.fo;
      if (fo.step === 'buzz') { toast('Pick who buzzed in first.', 'warn'); return; }
      if (fo.step === 'first') { act(() => { fo.firstRank = -1; fo.step = 'second'; strikeFx(1); }); return; }
      if (fo.step === 'second') {
        act(() => {
          fo.secondRank = -1;
          strikeFx(1);
          if (fo.firstRank >= 0) foWin(fo.first); else fo.step = 'hostpick';
        });
      }
      return;
    }
    if (G.phase === 'play') {
      act(() => {
        r.strikes = Math.min(3, r.strikes + 1);
        strikeFx(r.strikes);
        if (r.strikes >= 3) { G.phase = 'steal'; r.stealer = other(r.control); }
      });
      return;
    }
    if (G.phase === 'steal') act(() => { strikeFx(1); awardTo(r.control, 'stealfail'); });
  },
  faceoffAgain() {
    act(() => {
      if (G.phase !== 'faceoff') return false;
      G.round.fo = { step: 'buzz', first: null, firstRank: null, secondRank: null, winner: null };
      fx('faceoff');
      Sound.play('faceoff');
    });
  },
  foWinner(team) { act(() => { if (G.phase !== 'faceoff') return false; foWin(team); }); },
  choose(play) {
    act(() => {
      const r = G.round;
      if (G.phase !== 'faceoff' || r.fo.step !== 'playpass') return false;
      r.control = play ? r.fo.winner : other(r.fo.winner);
      G.phase = 'play';
      fx('control', { team: r.control });
      if (r.revealed.every(Boolean)) awardTo(r.control, 'cleared');
    });
  },
  switchControl() { act(() => { if (G.phase !== 'play') return false; G.round.control = other(G.round.control); fx('control', { team: G.round.control }); }); },
  awardNow(team) { act(() => { if (!['play', 'steal', 'faceoff'].includes(G.phase)) return false; awardTo(team, 'manual'); }); },
  showRest() {
    act(() => {
      const r = G.round;
      if (G.phase !== 'roundEnd') return false;
      let any = false;
      r.answers.forEach((a, i) => { if (!r.revealed[i]) { r.revealed[i] = true; r.free[i] = true; any = true; } });
      if (!any) return false;
      fx('rest');
      Sound.play('reveal');
    });
  },
  next() {
    act(() => {
      if (G.phase !== 'roundEnd') return false;
      const reached = G.teams.some((t) => t.score >= G.cfg.winScore);
      const out = G.roundNo >= G.cfg.rounds;
      if (reached || out) {
        if (G.teams[0].score === G.teams[1].score) {
          G.tiebreak = true;
          G.roundNo++;
          loadQuestion(false);
          fx('newround', { tiebreak: true });
          Sound.play('faceoff');
          return;
        }
        finishGame();
        return;
      }
      G.roundNo++;
      loadQuestion(false);
      fx('newround');
      Sound.play('faceoff');
    });
  },
  skip(random) {
    act(() => {
      if (!['faceoff', 'play', 'steal'].includes(G.phase)) return false;
      loadQuestion(!!random);
      fx('newround');
    });
  },
  adjust(team, delta) {
    act(() => {
      const t = G.teams[team];
      const n = Math.max(0, t.score + delta);
      if (n === t.score) return false;
      t.score = n;
      fx('score', { team });
    });
  },
  endGame() { act(() => { if (G.phase === 'gameOver') return false; finishGame(); }); },
};

/* =========================================================
   Lightning Round
   ========================================================= */
const Lightning = {
  timer: null,
  pickSet() {
    const sets = [];
    allPacks().forEach((p) => (p.lightning || []).forEach((s) => { if (s.questions && s.questions.length >= 5) sets.push(s); }));
    if (!sets.length) return null;
    const sig = (s) => s.name + '|' + s.questions[0].q;
    let used = Store.get('usedLightning', []);
    let pool = sets.filter((s) => !used.includes(sig(s)));
    if (!pool.length) { pool = sets; used = []; }
    const s = pool[Math.floor(Math.random() * pool.length)];
    Store.set('usedLightning', used.concat(sig(s)));
    return s;
  },
  start(team) {
    const s = Lightning.pickSet();
    if (!s) { toast('No Lightning Round questions found.', 'bad'); return; }
    act(() => {
      const times = [clamp(+settings.lightningTimes[0] || 20, 5, 120), clamp(+settings.lightningTimes[1] || 25, 5, 120)];
      G.lightning = {
        team: team >= 0 ? team : 0,
        setName: s.name,
        qs: s.questions.slice(0, 5).map((q) => ({ q: q.q, answers: q.answers.slice().sort((a, b) => b.points - a.points) })),
        times,
        target: clamp(+settings.lightningTarget || 200, 50, 500),
        player: 0,
        qi: 0,
        ans: [[null, null, null, null, null], [null, null, null, null, null]],
        stage: 'ready',
        timeLeft: times[0],
        running: false,
        shown: [0, 0],
      };
      G.phase = 'lightning';
      fx('lightning');
      Sound.play('intro');
    });
  },
  setTimes(t1, t2, target) {
    act(() => {
      const l = G.lightning;
      l.times = [clamp(+t1 || 20, 5, 120), clamp(+t2 || 25, 5, 120)];
      l.target = clamp(+target || 200, 50, 500);
      if (l.stage === 'ready') l.timeLeft = l.times[l.player];
    });
  },
  startTimer() {
    const l = G && G.lightning;
    if (!l || (l.stage !== 'ready' && l.stage !== 'playing')) return;
    act(() => {
      l.stage = 'playing';
      l.running = true;
      l.deadline = Date.now() + l.timeLeft * 1000;
      if (l.ans[l.player][l.qi]) l.qi = Lightning.nextEmpty(l, l.qi);
      fx('lstart');
    });
    Lightning.loop();
  },
  pause() {
    const l = G && G.lightning;
    if (!l || !l.running) return;
    act(() => { l.running = false; l.timeLeft = Math.max(0, Math.ceil(((l.deadline || Date.now()) - Date.now()) / 1000)); l.deadline = null; });
    Lightning.stopLoop();
  },
  loop() {
    Lightning.stopLoop();
    // Count down from a deadline so a slow or throttled window never drifts.
    Lightning.timer = setInterval(() => {
      const l = G && G.lightning;
      if (!l || !l.running) { Lightning.stopLoop(); return; }
      if (!l.deadline) l.deadline = Date.now() + l.timeLeft * 1000;
      const left = Math.max(0, Math.ceil((l.deadline - Date.now()) / 1000));
      if (left === l.timeLeft) return;
      l.timeLeft = left;
      if (left <= 5 && left > 0) Sound.play('tick');
      if (left <= 0) {
        l.running = false;
        l.deadline = null;
        Lightning.stopLoop();
        Sound.play('timeup');
        fx('timeup');
        l.stage = 'reveal';
        commit();
        return;
      }
      commitTick();
    }, 200);
  },
  stopLoop() { if (Lightning.timer) { clearInterval(Lightning.timer); Lightning.timer = null; } },
  nextEmpty(l, from) {
    const row = l.ans[l.player];
    for (let k = 1; k <= 5; k++) { const j = (from + k) % 5; if (!row[j]) return j; }
    return -1;
  },
  done() {
    const l = G && G.lightning;
    if (!l || (l.stage !== 'playing' && l.stage !== 'ready')) return;
    act(() => { l.running = false; l.stage = 'reveal'; });
    Lightning.stopLoop();
  },
  select(qi) { const l = G && G.lightning; if (!l || l.stage !== 'playing') return; act(() => { l.qi = clamp(qi, 0, 4); }); },
  /** Record an answer for the current player and question. matchIdx -1 forces "no match". */
  enter(text, matchIdx) {
    const l = G && G.lightning;
    if (!l || l.stage !== 'playing') { toast('Start the timer first.', 'warn'); return 'no'; }
    text = String(text || '').trim();
    const p = l.player;
    const qi = l.qi;
    const q = l.qs[qi];
    const idx = matchIdx != null ? matchIdx : matchGuess(text, q.answers);
    if (p === 1) {
      const prev = l.ans[0][qi];
      const sameText = text && prev && normalizeAnswer(prev.text) === normalizeAnswer(text);
      if (prev && ((idx >= 0 && prev.idx === idx) || sameText)) {
        Sound.play('duplicate');
        act(() => { fx('dup', { qi }); });
        toast('Duplicate answer. Try again!', 'warn');
        return 'dup';
      }
    }
    act(() => {
      const pts = idx >= 0 ? q.answers[idx].points : 0;
      l.ans[p][qi] = { text: text || (idx >= 0 ? q.answers[idx].text : 'No answer'), idx, points: pts };
      fx('lanswer');
      const n = Lightning.nextEmpty(l, qi);
      if (n < 0) { l.running = false; l.stage = 'reveal'; Lightning.stopLoop(); } else l.qi = n;
    });
    return 'ok';
  },
  pass() {
    const l = G && G.lightning;
    if (!l || l.stage !== 'playing') return;
    const n = Lightning.nextEmpty(l, l.qi);
    if (n < 0 || n === l.qi) { toast('That is the last open question.'); return; }
    act(() => { l.qi = n; });
  },
  revealNext() {
    const l = G && G.lightning;
    if (!l || l.stage !== 'reveal') return;
    const p = l.player;
    if (l.shown[p] >= 10) return;
    act(() => {
      l.shown[p]++;
      const k = l.shown[p];
      if (k % 2 === 0) {
        const a = l.ans[p][k / 2 - 1];
        Sound.play(a && a.points > 0 ? 'reveal' : 'zero');
      }
      fx('lreveal');
      if (l.shown[p] >= 10) Lightning.afterReveal(l);
    });
  },
  revealAll() {
    const l = G && G.lightning;
    if (!l || l.stage !== 'reveal') return;
    act(() => { l.shown[l.player] = 10; Sound.play('reveal'); fx('lreveal'); Lightning.afterReveal(l); });
  },
  afterReveal(l) {
    if (l.player === 0) { l.stage = 'between'; return; }
    l.stage = 'done';
    const total = Lightning.total(l);
    if (total >= l.target) { fx('lwin'); setTimeout(() => Sound.play('win'), 300); } else fx('llose');
  },
  nextPlayer() {
    const l = G && G.lightning;
    if (!l || l.stage !== 'between') return;
    act(() => { l.player = 1; l.qi = 0; l.stage = 'ready'; l.timeLeft = l.times[1]; fx('lp2'); });
  },
  total(l) {
    let t = 0;
    [0, 1].forEach((p) => {
      for (let i = 0; i < 5; i++) if (l.shown[p] >= (i + 1) * 2 && l.ans[p][i]) t += l.ans[p][i].points;
    });
    return t;
  },
};

/* =========================================================
   Answer timer (shot clock) for face-offs, steals or any guess.
   Not part of undo history; it is a stopwatch, not a game move.
   ========================================================= */
const Clock = {
  timer: null,
  start(sec) {
    if (!G) return;
    Clock.halt();
    G.clock = { left: sec, total: sec, running: true, id: uid('clk') };
    commit();
    Clock.timer = setInterval(() => {
      const c = G && G.clock;
      if (!c || !c.running) { Clock.halt(); return; }
      c.left = Math.max(0, c.left - 1);
      if (c.left > 0 && c.left <= 3) Sound.play('tick');
      if (c.left === 0) {
        c.running = false;
        Clock.halt();
        Sound.play('timeup');
        const id = c.id;
        setTimeout(() => { if (G && G.clock && G.clock.id === id) { G.clock = null; commit(); } }, 2500);
      }
      if (c.left === 0) commit(); else commitTick();
    }, 1000);
  },
  stop() { Clock.halt(); if (G && G.clock) { G.clock = null; commit(); } },
  halt() { if (Clock.timer) { clearInterval(Clock.timer); Clock.timer = null; } },
};

/* ---- sync.js ---- */
/* =========================================================
   Two-screen sync. Host -> board via postMessage on the window
   reference ('*' target, because file:// origins are opaque).
   Board -> host "hello" via window.opener. Storage event is a
   fallback when the browser shares localStorage between them.
   ========================================================= */
const Sync = {
  win: null,
  lastStatus: {},
  payload() {
    return { ff: 1, type: 'state', state: G, disp: displaySettings(), t: Date.now() };
  },
  open() {
    const url = location.href.split('#')[0] + '#board';
    let w = null;
    try { w = window.open(url, 'ff_board', 'popup=yes,width=1280,height=720'); } catch (e) { w = null; }
    if (!w) {
      modal({
        title: 'Your browser blocked the TV window',
        body: '<p>Look for a small "pop-up blocked" icon at the right end of the address bar. Choose <b>Always allow</b>, then click <b>Open TV board</b> again.</p><p>Or switch to one-screen mode in Settings.</p>',
      });
      return false;
    }
    Sync.win = w;
    try { w.focus(); } catch (e) { /* ignore */ }
    setTimeout(() => Sync.push(), 400);
    setTimeout(() => Sync.push(), 1200);
    Sync.updateConn();
    toast('Drag the new window onto your TV, then click it and press F for full screen.');
    return true;
  },
  isOpen() {
    try { return !!(Sync.win && !Sync.win.closed); } catch (e) { return false; }
  },
  push: debounce(() => Sync.pushNow(), 16),
  pushNow() {
    if (IS_BOARD) return;
    const msg = Sync.payload();
    if (Sync.isOpen()) { try { Sync.win.postMessage(msg, '*'); } catch (e) { /* ignore */ } }
    Store.set('sync', { t: msg.t, msg });
  },
  updateConn() {
    if (typeof renderConn === 'function') renderConn();
  },
  initHost() {
    window.addEventListener('message', (e) => {
      const d = e.data;
      if (!d || d.ff !== 1) return;
      if (d.type === 'hello') {
        if (e.source && e.source !== window) Sync.win = e.source;
        Sync.pushNow();
        Sync.updateConn();
      } else if (d.type === 'key') {
        if (typeof handleKey !== 'function' || modalOpen()) return;
        const typing = document.activeElement && document.activeElement.matches && document.activeElement.matches('input, textarea, select, [contenteditable]');
        const isBuzz = d.code === settings.keys.team1 || d.code === settings.keys.team2;
        if (typing && !isBuzz && !keyHooks.length) return;
        handleKey({ code: d.code, key: d.key, fromBoard: true, preventDefault() {} });
      } else if (d.type === 'status') {
        Sync.lastStatus = d;
        if (typeof onBoardStatus === 'function') onBoardStatus(d);
      }
    });
    setInterval(Sync.updateConn, 1000);
    window.addEventListener('beforeunload', () => { /* board stays open and re-requests state after reload */ });
  },
};

/* ---------- Board window side ---------- */
const BoardLink = {
  lastT: 0,
  onState: null,
  hello() {
    try { if (window.opener && !window.opener.closed) window.opener.postMessage({ ff: 1, type: 'hello' }, '*'); } catch (e) { /* ignore */ }
  },
  send(msg) {
    try { if (window.opener && !window.opener.closed) window.opener.postMessage(Object.assign({ ff: 1 }, msg), '*'); } catch (e) { /* ignore */ }
  },
  accept(msg) {
    if (!msg || msg.ff !== 1 || msg.type !== 'state') return;
    if (msg.t && msg.t < BoardLink.lastT) return;
    BoardLink.lastT = msg.t || Date.now();
    if (BoardLink.onState) BoardLink.onState(msg.state, msg.disp);
  },
  init(onState) {
    BoardLink.onState = onState;
    window.addEventListener('message', (e) => BoardLink.accept(e.data));
    window.addEventListener('storage', (e) => {
      if (e.key !== 'ff.sync' || !e.newValue) return;
      try { BoardLink.accept(JSON.parse(e.newValue).msg); } catch (err) { /* ignore */ }
    });
    // Start from whatever was last saved, then ask the host for fresh state.
    const saved = Store.get('sync', null);
    if (saved && saved.msg) BoardLink.accept(saved.msg);
    BoardLink.hello();
    // If the host reloads, keep asking until it answers again.
    setInterval(() => { if (Date.now() - BoardLink.lastT > 3000) BoardLink.hello(); }, 1500);
  },
};
