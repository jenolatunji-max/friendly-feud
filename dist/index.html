/* =========================================================
   TV board renderer. Used by the board window and by
   one-screen mode inside the host window.
   ========================================================= */
const X_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M20,6 L50,36 L80,6 L94,20 L64,50 L94,80 L80,94 L50,64 L20,94 L6,80 L36,50 L6,20 Z" fill="#E63946" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/></svg>';

/**
 * Make text fit its box without ever cutting it off:
 * shrink on one line first; if that would get too small, wrap to two lines and shrink until it fits.
 */
function fitText(n) {
  n.style.fontSize = '';
  n.classList.remove('two');
  if (!n.clientWidth || !n.textContent) return;
  const base = parseFloat(getComputedStyle(n).fontSize);
  const over = () => n.scrollWidth > n.clientWidth + 1 || n.scrollHeight > n.clientHeight + 1;
  let fs = base;
  const oneLineMin = base * 0.62;
  while (over() && fs > oneLineMin) { fs -= 1; n.style.fontSize = fs + 'px'; }
  if (!over()) return;
  // Two lines: start a little smaller than the base, then shrink until both lines fit.
  n.classList.add('two');
  fs = Math.min(base * 0.82, fs + 4);
  n.style.fontSize = fs + 'px';
  const min = Math.max(8, base * 0.3);
  while (over() && fs > min) { fs -= 1; n.style.fontSize = fs + 'px'; }
}

function createBoard(el, opts) {
  opts = opts || {};
  el.innerHTML = `
  <div class="bd" aria-live="polite">
    <div class="bd-team bd-t0"><div class="bd-tname"></div><div class="bd-tscore">0</div><div class="bd-ctl"></div></div>
    <div class="bd-center">
      <div class="bd-top">
        <div class="bd-round"></div>
        <div class="bd-pot"><span>Round pot</span><b>0</b></div>
        <div class="bd-mult"></div>
      </div>
      <div class="bd-q"></div>
      <div class="bd-frame"><div class="bulbs"></div><div class="bd-grid"></div></div>
      <div class="bd-foot"><div class="bd-clock" aria-hidden="true"><b></b></div><div class="bd-banner"></div><div class="bd-sx">${'<i>' + X_SVG + '</i>'}${'<i>' + X_SVG + '</i>'}${'<i>' + X_SVG + '</i>'}</div></div>
    </div>
    <div class="bd-team bd-t1"><div class="bd-tname"></div><div class="bd-tscore">0</div><div class="bd-ctl"></div></div>
    <div class="bd-strikes" aria-hidden="true"></div>
    <div class="bd-over bd-idle">
      <div class="bd-idle-logo">${logoSVG(BRAND_NAME)}</div>
      <div class="bd-idle-t">Get ready for game night!</div>
      <div class="bd-idle-h">${opts.standalone ? 'Drag this window onto your TV, then click it and press F for full screen.' : 'Waiting for the host to start a game.'}</div>
    </div>
    <div class="bd-over bd-win">
      <div class="bd-win-k">Winner</div>
      <div class="bd-win-n"></div>
      <div class="bd-win-s"></div>
    </div>
    <div class="bd-over bd-lr"></div>
    <div class="bd-hint"></div>
  </div>`;
  const q = (s) => el.querySelector(s);
  const bulbs = q('.bulbs');
  // Marquee bulbs around the board frame
  const top = 22;
  const side = 8;
  const pos = [];
  for (let i = 0; i <= top; i++) pos.push([i / top, 0]);
  for (let i = 1; i <= side; i++) pos.push([1, i / (side + 1)]);
  for (let i = top; i >= 0; i--) pos.push([i / top, 1]);
  for (let i = side; i >= 1; i--) pos.push([0, i / (side + 1)]);
  bulbs.innerHTML = pos.map(([x, y]) => `<i class="bulb" style="left:calc(var(--u)*1.1 + (100% - var(--u)*2.2)*${x.toFixed(4)});top:calc(var(--u)*1.1 + (100% - var(--u)*2.2)*${y.toFixed(4)})"></i>`).join('');

  let roundKey = null;
  let lastFx = null;
  let first = true;
  let winShownFor = null;
  let lrKey = null;
  let bannerText = '';

  function setText(sel, txt) { const n = q(sel); if (n.textContent !== String(txt)) n.textContent = txt; }

  function buildTiles(r) {
    const grid = q('.bd-grid');
    let html = '';
    for (let i = 0; i < 8; i++) {
      const a = r.answers[i];
      if (!a) { html += '<div class="tile empty"></div>'; continue; }
      const len = a.text.length;
      const sz = len > 18 ? 'xs' : len > 14 ? 'sm' : '';
      html += `<div class="tile instant ${r.revealed[i] ? 'revealed' : ''}" data-i="${i}">
        <div class="tile-in">
          <div class="tile-front"><span class="num">${i + 1}</span></div>
          <div class="tile-back"><span class="ans ${sz}">${esc(a.text)}</span><span class="pts">${a.points}</span></div>
        </div></div>`;
    }
    grid.innerHTML = html;
    fitAll();
    requestAnimationFrame(() => requestAnimationFrame(() => $$('.tile.instant', grid).forEach((t) => t.classList.remove('instant'))));
  }

  function fitAll() { $$('.tile-back .ans, .lr-a', el).forEach(fitText); }
  window.addEventListener('resize', debounce(fitAll, 150));
  // Refit whenever the board changes size (window moved to the TV, full screen, one-screen mode shown).
  let lastSize = '';
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(debounce(() => {
      const s = el.clientWidth + 'x' + el.clientHeight;
      if (s !== lastSize && el.clientWidth) { lastSize = s; fitAll(); }
    }, 60)).observe(el);
  }
  document.addEventListener('fullscreenchange', () => setTimeout(fitAll, 120));

  function showStrikes(n, reduced) {
    const s = q('.bd-strikes');
    s.innerHTML = Array.from({ length: n }, () => `<div class="xmark">${X_SVG}</div>`).join('');
    s.classList.remove('show');
    void s.offsetWidth;
    s.classList.add('show');
    clearTimeout(showStrikes.t);
    showStrikes.t = setTimeout(() => s.classList.remove('show'), reduced ? 1500 : 1400);
  }
  function pulse(sel) {
    const n = q(sel);
    if (!n) return;
    n.classList.remove('pulse');
    void n.offsetWidth;
    n.classList.add('pulse');
  }
  function banner(text) {
    const b = q('.bd-banner');
    if (text === bannerText) return;
    bannerText = text;
    b.textContent = text;
    fitText(b);
    b.classList.remove('pop');
    void b.offsetWidth;
    if (text) b.classList.add('pop');
  }

  function phaseBanner(S) {
    const r = S.round;
    const tn = (t) => (S.teams[t] ? S.teams[t].name : '');
    switch (S.phase) {
      case 'faceoff': {
        const fo = r.fo;
        if (fo.step === 'buzz') return S.tiebreak ? 'Tiebreaker face-off!' : 'Face-off!';
        if (fo.step === 'first') return 'Buzzed in: ' + tn(fo.first);
        if (fo.step === 'second') return 'Your turn to beat it: ' + tn(other(fo.first));
        if (fo.step === 'hostpick') return 'Nobody found it!';
        if (fo.step === 'playpass') return 'Face-off winner: ' + tn(fo.winner) + '. Play or pass?';
        return '';
      }
      case 'play': return 'Playing: ' + tn(r.control);
      case 'steal': return 'Chance to steal: ' + tn(r.stealer);
      case 'roundEnd':
        if (!r.awarded) return '';
        return (r.awarded.why === 'steal' ? 'Stolen! ' : '') + r.awarded.pts + ' points to ' + tn(r.awarded.team) + '!';
      default: return '';
    }
  }

  function renderLightning(S, disp) {
    const l = S.lightning;
    const over = q('.bd-lr');
    const key = S.id + '|' + l.setName;
    if (lrKey !== key) {
      lrKey = key;
      over.innerHTML = `
        <div class="lr-head"><div class="lr-logo">${logoSVG(BRAND_NAME, { title: false })}</div><div class="lr-title">Lightning Round</div></div>
        <div class="lr-timer"><span></span></div>
        <div class="lr-q"></div>
        <div class="lr-cols">${[0, 1].map((p) => `<div class="lr-col" data-p="${p}"><div class="lr-who"></div>${[0, 1, 2, 3, 4].map((i) => `<div class="lr-row" data-i="${i}"><span class="lr-a"></span><span class="lr-p"></span></div>`).join('')}</div>`).join('')}</div>
        <div class="lr-total"><span>Total</span><b>0</b><em></em></div>
        <div class="lr-result"></div>`;
    }
    const playing = l.stage === 'ready' || l.stage === 'playing';
    over.querySelector('.lr-timer span').textContent = l.timeLeft;
    over.querySelector('.lr-timer').classList.toggle('hide', !playing);
    over.querySelector('.lr-timer').classList.toggle('low', playing && l.running && l.timeLeft <= 5);
    over.querySelector('.lr-q').textContent = disp.showQuestion && l.stage === 'playing' && l.qs[l.qi] ? l.qs[l.qi].q : '';
    [0, 1].forEach((p) => {
      const col = over.querySelector(`.lr-col[data-p="${p}"]`);
      col.querySelector('.lr-who').textContent = 'Player ' + (p + 1);
      const hidden = p === 0 && l.player === 1 && (l.stage === 'ready' || l.stage === 'playing');
      col.classList.toggle('masked', hidden);
      col.classList.toggle('active', l.player === p && l.stage !== 'done');
      for (let i = 0; i < 5; i++) {
        const row = col.querySelector(`.lr-row[data-i="${i}"]`);
        const a = l.ans[p][i];
        const showA = !hidden && l.shown[p] >= i * 2 + 1;
        const showP = !hidden && l.shown[p] >= i * 2 + 2;
        const at = showA ? (a ? a.text : '-') : '';
        const pt = showP ? (a ? String(a.points) : '0') : '';
        const ae = row.querySelector('.lr-a');
        const pe = row.querySelector('.lr-p');
        if (ae.textContent !== at) { ae.textContent = at; fitText(ae); if (at) { row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); } }
        if (pe.textContent !== pt) pe.textContent = pt;
        row.classList.toggle('on', !!at);
        row.classList.toggle('pon', !!pt);
      }
    });
    over.querySelector('.lr-total b').textContent = Lightning.total(l);
    over.querySelector('.lr-total em').textContent = 'Goal ' + l.target;
    const res = over.querySelector('.lr-result');
    if (l.stage === 'done') {
      const won = Lightning.total(l) >= l.target;
      res.textContent = won ? 'You did it!' : 'So close!';
      res.className = 'lr-result show ' + (won ? 'won' : 'lost');
    } else { res.className = 'lr-result'; res.textContent = ''; }
  }

  function render(S, disp) {
    disp = disp || displaySettings();
    const reduced = prefersReducedMotion(disp);
    const root = q('.bd');
    root.classList.toggle('noq', !disp.showQuestion);
    const idle = q('.bd-idle');
    if (!S || !S.round) {
      idle.classList.add('show');
      q('.bd-win').classList.remove('show');
      q('.bd-lr').classList.remove('show');
      return;
    }
    idle.classList.remove('show');
    const r = S.round;

    // Teams
    [0, 1].forEach((t) => {
      const panel = q('.bd-t' + t);
      const team = S.teams[t];
      panel.style.setProperty('--tc', colorHex(team.color));
      panel.querySelector('.bd-tname').textContent = team.name;
      const sc = panel.querySelector('.bd-tscore');
      if (sc.textContent !== String(team.score)) { sc.textContent = team.score; if (!first) pulse('.bd-t' + t + ' .bd-tscore'); }
      const ctl = (S.phase === 'play' && r.control === t) || (S.phase === 'steal' && r.stealer === t) || (S.phase === 'faceoff' && r.fo.step === 'first' && r.fo.first === t);
      panel.classList.toggle('ctl', !!ctl);
      panel.querySelector('.bd-ctl').textContent = S.phase === 'steal' && r.stealer === t ? 'Steal!' : S.phase === 'play' && r.control === t ? 'Playing' : (S.phase === 'faceoff' && r.fo.step === 'first' && r.fo.first === t ? 'Buzzed in' : '');
    });

    // Header
    setText('.bd-round', S.tiebreak && S.phase !== 'gameOver' ? 'Tiebreaker' : 'Round ' + S.roundNo);
    const potEl = q('.bd-pot b');
    const potVal = S.phase === 'roundEnd' && r.awarded ? r.awarded.pts : r.pot;
    if (potEl.textContent !== String(potVal)) { potEl.textContent = potVal; if (!first) pulse('.bd-pot'); }
    setText('.bd-mult', r.mult === 3 ? 'Triple points!' : r.mult === 2 ? 'Double points!' : '');
    q('.bd-mult').classList.toggle('on', r.mult > 1);
    setText('.bd-q', r.q);

    // Tiles
    if (r.key !== roundKey) { roundKey = r.key; buildTiles(r); } else {
      $$('.tile[data-i]', q('.bd-grid')).forEach((tile) => {
        const i = +tile.dataset.i;
        tile.classList.toggle('revealed', !!r.revealed[i]);
        tile.classList.toggle('free', !!r.free[i]);
      });
    }
    banner(phaseBanner(S));
    if (!render.tipGone && (r.revealed.some(Boolean) || S.roundNo > 1 || S.phase === 'gameOver' || S.phase === 'lightning')) { render.tipGone = true; hint('', 0); }
    const ck = q('.bd-clock');
    const c = S.clock;
    ck.classList.toggle('on', !!c && S.phase !== 'gameOver' && S.phase !== 'lightning');
    if (c) { setText('.bd-clock b', c.left); ck.classList.toggle('low', c.left <= 3); ck.style.setProperty('--pct', (c.total ? c.left / c.total : 0) * 100 + '%'); }

    // Strikes indicator (persistent small X's under the board while playing)
    root.dataset.strikes = S.phase === 'play' || S.phase === 'steal' ? r.strikes : 0;

    // Effects (skip on first render so a reconnect does not replay them)
    if (S.fx && S.fx.id !== lastFx) {
      lastFx = S.fx.id;
      if (!first) {
        if (S.fx.type === 'strike') showStrikes(S.fx.count || 1, reduced);
        if (S.fx.type === 'buzz') pulse('.bd-t' + S.fx.team);
        if (S.fx.type === 'dup') pulse('.bd-lr .lr-timer');
      }
    }

    // Winner overlay
    const win = q('.bd-win');
    if (S.phase === 'gameOver') {
      win.classList.add('show');
      const w = S.winner;
      const n = q('.bd-win-n');
      if (w >= 0) {
        n.textContent = S.teams[w].name;
        n.style.color = colorHex(S.teams[w].color);
        q('.bd-win-s').textContent = S.teams[w].score + ' points';
        setText('.bd-win-k', 'Winner');
      } else {
        n.textContent = "It's a tie!";
        n.style.color = '';
        q('.bd-win-s').textContent = S.teams[0].score + ' to ' + S.teams[1].score;
        setText('.bd-win-k', 'What a game');
      }
      if (winShownFor !== S.id && !first) { winShownFor = S.id; Confetti.burst(reduced); }
      winShownFor = S.id;
    } else win.classList.remove('show');

    // Lightning overlay
    const lr = q('.bd-lr');
    if (S.phase === 'lightning' && S.lightning) {
      lr.classList.add('show');
      renderLightning(S, disp);
      if (S.fx && S.fx.type === 'lwin' && S.fx.id !== render.lastLwin) { render.lastLwin = S.fx.id; if (!first) Confetti.burst(reduced); }
    } else lr.classList.remove('show');

    first = false;
  }
  function hint(text, ms) {
    const h = q('.bd-hint');
    h.textContent = text;
    h.classList.toggle('show', !!text);
    clearTimeout(hint.t);
    if (text && ms) hint.t = setTimeout(() => h.classList.remove('show'), ms);
  }
  return { render, hint };
}

/* ---------- Board window bootstrap ---------- */
function startBoardWindow() {
  document.title = BRAND_NAME + ' - TV board';
  document.body.classList.add('board-mode');
  const root = document.createElement('div');
  root.id = 'board-root';
  document.body.appendChild(root);
  const board = createBoard(root, { standalone: true });
  let lastState = null;
  let lastDisp = displaySettings();
  applyDisplay(lastDisp);
  board.render(null, lastDisp);
  board.hint('Drag this window onto your TV, then click it and press F for full screen.', 12000);
  BoardLink.init((state, disp) => {
    lastState = state;
    lastDisp = disp || lastDisp;
    applyDisplay(lastDisp);
    board.render(state, lastDisp);
  });
  const status = () => BoardLink.send({ type: 'status', fullscreen: isFullscreen(), w: window.innerWidth, h: window.innerHeight });
  document.addEventListener('fullscreenchange', () => { status(); if (isFullscreen()) board.hint('', 0); });
  document.addEventListener('webkitfullscreenchange', () => { status(); if (isFullscreen()) board.hint('', 0); });
  window.addEventListener('resize', debounce(status, 200));
  setTimeout(status, 500);
  document.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'KeyF') { toggleFullscreen(); return; }
    if (e.code === 'Escape') return;
    // Forward everything else (USB buzzers send keystrokes to the focused window)
    if (/^Shift|^Digit|^Numpad|^Key|^Space|^Enter|^Arrow|^Control|^Alt/.test(e.code)) {
      e.preventDefault();
      BoardLink.send({ type: 'key', code: e.code, key: e.key });
    }
  });
  document.addEventListener('dblclick', toggleFullscreen);
  window.__ffBoard = { get state() { return lastState; } };
}

/* ---- confetti.js ---- */
/* =========================================================
   Confetti (canvas). Skipped when reduced motion is on.
   ========================================================= */
const Confetti = {
  burst(reduced) {
    if (reduced) return;
    let c = $('#confetti');
    if (!c) {
      c = document.createElement('canvas');
      c.id = 'confetti';
      c.setAttribute('aria-hidden', 'true');
      document.body.appendChild(c);
    }
    const ctx = c.getContext('2d');
    if (!ctx) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = (c.width = innerWidth * dpr);
    const H = (c.height = innerHeight * dpr);
    const colors = ['#F6B93B', '#FFF6E0', '#2F6BFF', '#E63946', '#56B4E9', '#009E73', '#CC79A7'];
    const parts = Array.from({ length: 220 }, () => ({
      x: W * (0.15 + Math.random() * 0.7),
      y: H * (0.25 + Math.random() * 0.1),
      vx: (Math.random() - 0.5) * 22 * dpr,
      vy: (-12 - Math.random() * 16) * dpr,
      s: (6 + Math.random() * 9) * dpr,
      r: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.35,
      c: colors[Math.floor(Math.random() * colors.length)],
    }));
    const start = performance.now();
    cancelAnimationFrame(Confetti.raf);
    const step = (now) => {
      const t = now - start;
      ctx.clearRect(0, 0, W, H);
      parts.forEach((p) => {
        p.vy += 0.42 * dpr;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.r += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.r);
        ctx.fillStyle = p.c;
        ctx.globalAlpha = Math.max(0, 1 - t / 5200);
        ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
        ctx.restore();
      });
      if (t < 5200) Confetti.raf = requestAnimationFrame(step); else ctx.clearRect(0, 0, W, H);
    };
    Confetti.raf = requestAnimationFrame(step);
  },
};

  g.addEventListener('click', onDeskClick);
  $('#d-guess').addEventListener('input', renderGuess);
  $('#d-guess').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      const i = matchGuess(e.target.value, (G && G.round && G.round.answers) || []);
      if (i >= 0) { Actions.reveal(i); e.target.value = ''; renderGuess(); }
    }
    if (e.key === 'Escape') e.target.blur();
  });
  $('#l-input').addEventListener('input', renderLGuess);
  $('#l-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const inp = $('#l-input');
    if (!inp.value.trim()) { toast('Type an answer, or use No match.'); return; }
    const r = Lightning.enter(inp.value);
    if (r === 'ok') { inp.value = ''; renderLGuess(); }
    if (r === 'dup') inp.select();
  });
  $('#drawer-tab').addEventListener('click', () => { drawerSticky = !drawerSticky; updateDrawer(); });
  singleBoard = createBoard($('#single-board'), { standalone: false });
}

function deskMode() { return (G && G.cfg && G.cfg.screenMode) || settings.screenMode; }
function updateDrawer() {
  const single = deskMode() === 'single';
  const desk = $('#desk');
  desk.classList.toggle('drawer', single);
  desk.classList.toggle('open', single && (drawerHeld || drawerSticky));
  $('#single-board').hidden = !single;
  $('#drawer-tab').hidden = !single;
  $('#drawer-tab').textContent = drawerSticky ? 'Hide host panel' : 'Host panel (hold H)';
}

async function onDeskClick(e) {
  const b = e.target.closest('[data-act], [data-rev], [data-lans]');
  if (!b || b.disabled) return;
  if (b.dataset.rev != null) { Actions.reveal(+b.dataset.rev); return; }
  if (b.dataset.lans != null) { const l = G.lightning; const a = l.qs[l.qi].answers[+b.dataset.lans]; Lightning.enter(a.text, +b.dataset.lans); return; }
  const a = b.dataset.act;
  const t = b.dataset.team != null ? +b.dataset.team : null;
  switch (a) {
    case 'home': go('home'); break;
    case 'undo': undo(); break;
    case 'mute': toggleMute(); break;
    case 'print': printCards(upcomingRounds(), 'Host cards for this game'); break;
    case 'settings': go('settings'); break;
    case 'end':
      if (G.phase === 'gameOver') { go('home'); break; }
      if (await confirmBox('End the game now?', 'The team with the most points wins. You can undo this.', 'End game')) Actions.endGame();
      break;
    case 'buzz': Actions.buzz(t); break;
    case 'miss': Actions.miss(); break;
    case 'fowin': Actions.foWinner(t); break;
    case 'foagain': Actions.faceoffAgain(); break;
    case 'play': Actions.choose(true); break;
    case 'pass': Actions.choose(false); break;
    case 'switch': Actions.switchControl(); break;
    case 'awardnow':
      if (await confirmBox('Give the pot now?', `Give ${G.round.pot * G.round.mult} points to ${esc(teamName(t))} and end the round.`, 'Give points')) Actions.awardNow(t);
      break;
    case 'rest': Actions.showRest(); break;
    case 'next': Actions.next(); break;
    case 'skip': Actions.skip(false); break;
    case 'swap': Actions.skip(true); break;
    case 'adj': Actions.adjust(t, +b.dataset.d); break;
    case 'adjc': adjustDialog(t); break;
    case 'openboard': Sync.open(); break;
    case 'clock': Clock.start(+b.dataset.s); break;
    case 'clockstop': Clock.stop(); break;
    case 'toggleq': settings.showQuestion = !settings.showQuestion; saveSettings(); renderGame(); break;
    case 'lightning': Lightning.start(G.winner >= 0 ? G.winner : 0); break;
    case 'rematch': rematch(); break;
    case 'newgame': go('setup'); break;
    case 'tipclose': Store.set('tipSeen', true); $('#d-tip').hidden = true; break;
    case 'l-start': Lightning.startTimer(); setTimeout(() => $('#l-input') && $('#l-input').focus(), 50); break;
    case 'l-pause': Lightning.pause(); break;
    case 'l-done': Lightning.done(); break;
    case 'l-nomatch': { const v = $('#l-input').value; if (Lightning.enter(v, -1) === 'ok') { $('#l-input').value = ''; renderLGuess(); } break; }
    case 'l-pass': Lightning.pass(); break;
    case 'l-sel': Lightning.select(+b.dataset.q); break;
    case 'l-reveal': Lightning.revealNext(); break;
    case 'l-revealall': Lightning.revealAll(); break;
    case 'l-p2': Lightning.nextPlayer(); break;
    case 'l-times': Lightning.setTimes($('#l-t1').value, $('#l-t2').value, $('#l-tg').value); toast('Saved.'); break;
    case 'l-exit': act(() => { G.phase = 'gameOver'; Lightning.stopLoop(); G.fx = null; }); break;
    default: break;
  }
}

async function adjustDialog(t) {
  const v = await modal({
    title: 'Adjust ' + teamName(t) + "'s score",
    body: `<label class="fld">New score<input id="adj-v" type="number" min="0" step="1" value="${G.teams[t].score}" autofocus></label>`,
    actions: [{ label: 'Cancel', value: null }, { label: 'Save score', primary: true, value: 'save', validate: (w) => { adjustDialog.v = w.querySelector('#adj-v').value; return true; } }],
    onOpen: (w, close) => { const i = w.querySelector('#adj-v'); i.select(); i.addEventListener('keydown', (e) => { if (e.key === 'Enter') { adjustDialog.v = i.value; close('save'); } }); },
  });
  if (v !== 'save') return;
  const n = Math.max(0, Math.round(+adjustDialog.v || 0));
  Actions.adjust(t, n - G.teams[t].score);
}
function rematch() {
  const cfg = deepCopy(G.cfg);
  if (newGame(cfg)) { go('game'); toast('New game, same teams. Good luck!'); }
}
function upcomingRounds() {
  if (!G) return [];
  const out = [];
  if (G.round) out.push({ q: G.round.q, answers: G.round.answers });
  const left = Math.max(0, G.cfg.rounds - G.roundNo) + 4;
  for (let k = 0; k < left && G.qPtr + k < G.queue.length; k++) {
    const ref = G.queue[G.qPtr + k];
    const p = getPack(ref.packId);
    if (p && p.rounds[ref.i]) out.push(p.rounds[ref.i]);
  }
  return out;
}

/* ---------- One-click mute ---------- */
const ICON_SOUND = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const ICON_MUTE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
function toggleMute() {
  settings.sound.muted = !settings.sound.muted;
  saveSettings();

/* ---------- Rendering ---------- */
function renderConn() {
  const el = $('#d-conn');
  if (!el || !G) return;
  let html;
  if (deskMode() === 'single') html = '<span class="dot ok"></span>One screen. Hold H for this panel.';
  else if (Sync.isOpen()) html = '<span class="dot ok"></span>TV board connected';
  else html = '<span class="dot bad"></span>TV board disconnected: <button type="button" class="btn btn-gold btn-sm" data-act="openboard">Reopen</button>';
  if (el.innerHTML !== html) {
    el.innerHTML = html;
    // Connection changed: refresh the tools row so "Open TV board" shows only when needed.
    const tb = $('#d-tools [data-act="openboard"]');

  }
}

function teamBtn(t, act, label) {
  return `<button type="button" class="btn btn-team" data-act="${act}" data-team="${t}" style="--tc:${colorHex(G.teams[t].color)}">${label}</button>`;
}

function say(text) { return settings.hostScript === false ? '' : `<p class="say"><span>Say</span>"${text}"</p>`; }

function phaseHTML() {
  const r = G.round;
  const tn = (t) => esc(teamName(t));
  const strikes = `<div class="strikes" aria-label="${r.strikes} of 3 strikes">${[0, 1, 2].map((i) => `<span class="sx ${i < r.strikes ? 'on' : ''}">X</span>`).join('')}</div>`;
  const pot = `<div class="potline"><span>Round pot</span><b>${r.pot}</b>${r.mult > 1 ? `<em>x${r.mult} = ${r.pot * r.mult}</em>` : ''}</div>`;
  switch (G.phase) {
    case 'faceoff': {
      const fo = r.fo;
      if (fo.step === 'buzz') {
        return `<h3>Face-off!</h3>${say('Hands on your buzzers. Here is the question: ' + esc(r.q))}<p>One player from each team steps up. Who buzzed in first?</p>
          <div class="btn-row">${teamBtn(0, 'buzz', tn(0) + ' buzzed')}${teamBtn(1, 'buzz', tn(1) + ' buzzed')}</div>
          <p class="hint">Buzzer keys: ${esc(keyLabel(settings.keys.team1))} for ${tn(0)}, ${esc(keyLabel(settings.keys.team2))} for ${tn(1)}.</p>`;
      }
      if (fo.step === 'first' || fo.step === 'second') {
        const who = fo.step === 'first' ? fo.first : other(fo.first);
        const prev = fo.step === 'second' ? (fo.firstRank >= 0 ? `<p class="hint">${tn(fo.first)} found answer #${fo.firstRank + 1}. To win, ${tn(who)} must name a higher answer.</p>` : `<p class="hint">${tn(fo.first)} missed. Any answer on the board wins it for ${tn(who)}.</p>`) : '';
        return `<h3>Answering: ${tn(who)}</h3>${say(fo.step === 'first' ? 'What do you say? ... Let\'s see the board!' : 'Can you beat it? Let\'s see the board!')}<p>Click their answer on the left. Not there?</p>
          <div class="btn-row"><button type="button" class="btn btn-red btn-big" data-act="miss">Not on the board <kbd>X</kbd></button></div>${prev}${pot}`;
      }
      if (fo.step === 'hostpick') {
        return `<h3>Nobody found it</h3><p>Neither answer is on the board. Try again, or you pick who plays.</p>
          <div class="btn-row"><button type="button" class="btn btn-gold" data-act="foagain">Face-off again</button></div>
          <div class="btn-row">${teamBtn(0, 'fowin', tn(0) + ' plays')}${teamBtn(1, 'fowin', tn(1) + ' plays')}</div>`;
      }
      if (fo.step === 'playpass') {
        return `<h3>Face-off winner: ${tn(fo.winner)}</h3>${say(tn(fo.winner) + ', do you want to play or pass?')}<p>Did they choose to play or pass?</p>
          <div class="btn-row"><button type="button" class="btn btn-gold btn-big" data-act="play">Play</button><button type="button" class="btn btn-big" data-act="pass">Pass to ${tn(other(fo.winner))}</button></div>${pot}`;
      }
      return '';
    }
    case 'play':
      return `<h3>Playing: ${tn(r.control)}</h3>${say(r.strikes === 2 ? 'Careful, one more strike and they can steal!' : 'Next player, give me an answer!')}<p>Click each right answer. Wrong answer? Strike it.</p>
        <div class="btn-row"><button type="button" class="btn btn-red btn-big" data-act="miss">Strike <kbd>X</kbd></button></div>
        ${strikes}${pot}
        <div class="btn-row small"><button type="button" class="btn btn-ghost btn-sm" data-act="switch">Switch team</button><button type="button" class="btn btn-ghost btn-sm" data-act="awardnow" data-team="${r.control}">Give pot to ${tn(r.control)} now</button></div>`;
    case 'steal':
      return `<h3>Three strikes!</h3>${say(tn(r.stealer) + ', huddle up. One answer to steal it all.')}<p>Chance to steal for ${tn(r.stealer)}: one guess takes the whole pot. Talk it over, then click their answer if it's on the board.</p>
        <div class="btn-row"><button type="button" class="btn btn-red btn-big" data-act="miss">Steal failed <kbd>X</kbd></button></div>${strikes}${pot}`;
    case 'roundEnd': {
      const aw = r.awarded;
      const left = r.revealed.some((x) => !x);
      const ends = gameWillEnd();
      return `<h3>${aw.why === 'steal' ? 'Stolen! ' : ''}${aw.pts} points to ${tn(aw.team)}</h3>${say(left ? 'Let\'s see the rest of the top answers!' : 'Give it up for ' + tn(aw.team) + '!')}
        <p>${aw.why === 'cleared' ? 'They cleared the board.' : aw.why === 'stealfail' ? 'The steal missed, so the pot stays.' : r.mult > 1 ? `Pot of ${r.pot} times ${r.mult}.` : 'Nice round.'}</p>
        <div class="btn-row">${left ? '<button type="button" class="btn btn-ghost btn-big" data-act="rest">Show the rest</button>' : ''}<button type="button" class="btn btn-gold btn-big" data-act="next">${ends ? 'See the winner' : 'Next round'} <kbd>N</kbd></button></div>`;
    }
    case 'gameOver': {
      const w = G.winner;
      return `<h3>${w >= 0 ? 'Winner: ' + tn(w) : "It's a tie!"}</h3>${say(w >= 0 ? 'Congratulations, ' + tn(w) + '! Who is ready for the Lightning Round?' : 'What a game!')}
        <p>${tn(0)} ${G.teams[0].score}, ${tn(1)} ${G.teams[1].score}.</p>
        <div class="btn-row"><button type="button" class="btn btn-gold btn-big" data-act="lightning">Play the Lightning Round${w >= 0 ? ' for ' + tn(w) : ''}</button></div>
        <div class="btn-row"><button type="button" class="btn" data-act="rematch">Rematch</button><button type="button" class="btn btn-ghost" data-act="newgame">New game</button><button type="button" class="btn btn-ghost" data-act="home">Home</button></div>`;
    }
    default: return '';
  }
}

/** Remember which control had keyboard focus so re-rendering does not drop it. */
function focusKey() {
  const a = document.activeElement;
  if (!a || a === document.body || !a.closest || !a.closest('#game')) return null;
  if (a.id) return '#' + a.id;
  const attrs = ['data-act', 'data-team', 'data-d', 'data-rev', 'data-lans', 'data-q', 'data-s'].filter((x) => a.hasAttribute(x));
  return attrs.length ? attrs.map((x) => '[' + x + '="' + a.getAttribute(x) + '"]').join('') : null;
}
function restoreFocus(sel) {
  if (!sel || (document.activeElement && document.activeElement !== document.body)) return;
  const n = document.querySelector('#game ' + sel);
  if (n && !n.disabled) { try { n.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
}
/** Light update for timer ticks: change the numbers only, keep every button in place. */
function renderTick() {
  if (SCREEN !== 'game' || !G) return;
  const l = G.lightning;
  if (G.phase === 'lightning' && l) {
    const t = $('#l-phase .l-timer');
    if (t) { t.firstChild.nodeValue = l.timeLeft; t.classList.toggle('low', l.running && l.timeLeft <= 5); }
  }
  const cs = $('#d-tools [data-act="clockstop"]');
  if (cs && G.clock) cs.textContent = 'Stop timer (' + G.clock.left + ')';
  if (singleBoard && deskMode() === 'single') singleBoard.render(G, displaySettings());
}

function renderGame() {
  const fk = focusKey();
  renderGameInner();
  restoreFocus(fk);
}

  updateDrawer();

      <button type="button" class="arow ${r.revealed[i] ? 'on' : ''} ${r.free[i] ? 'free' : ''}" data-rev="${i}" aria-pressed="${r.revealed[i]}" title="Press ${i + 1} to reveal">
        <span class="anum">${i + 1}</span>

        <button type="button" class="btn btn-ghost btn-sm" data-act="adjc" data-team="${i}">Edit</button>
        <button type="button" class="btn btn-ghost btn-sm" data-act="adj" data-team="${i}" data-d="10" aria-label="Give 10 points to ${esc(t.name)}">+10</button>
      </div>
    </div>`).join('');
  const playing = ['faceoff', 'play', 'steal'].includes(G.phase);
  $('#d-tools').innerHTML = lr ? '' : `

    <span class="clock-tools" role="group" aria-label="Answer timer">${G.clock ? `<button type="button" class="btn btn-gold btn-sm" data-act="clockstop">Stop timer (${G.clock.left})</button>` : `<span class="muted">Timer</span>${[5, 10, 20, 30].map((n) => `<button type="button" class="btn btn-ghost btn-sm" data-act="clock" data-s="${n}">${n}s</button>`).join('')}`}</span>
    <button type="button" class="btn btn-ghost btn-sm" data-act="toggleq" aria-pressed="${settings.showQuestion}">Question on TV: ${settings.showQuestion ? 'On' : 'Off'}</button>
    ${deskMode() === 'two' && !Sync.isOpen() ? '<button type="button" class="btn btn-gold btn-sm" data-act="openboard">Open TV board <kbd>B</kbd></button>' : ''}`;

  } else tip.hidden = true;
  if (singleBoard && deskMode() === 'single') singleBoard.render(G, displaySettings());
}

function renderGuess() {
  const out = $('#d-guess-out');
  const inp = $('#d-guess');
  if (!out || !inp) return;
  const v = inp.value.trim();
  if (!v || !G || !G.round) { out.innerHTML = ''; return; }
  const i = matchGuess(v, G.round.answers);
  if (i < 0) out.innerHTML = '<span class="bad">No match. That one is a strike.</span>';
  else {
    const a = G.round.answers[i];
    out.innerHTML = G.round.revealed[i]
      ? `<span class="warn">Matches #${i + 1} ${esc(a.text)}, already on the board.</span>`
      : `<span class="ok">Matches #${i + 1} ${esc(a.text)} (${a.points}). Press Enter to reveal.</span>`;
  }
}
function renderLGuess() {
  const out = $('#l-guess-out');
  const l = G && G.lightning;
  if (!out || !l) return;
  const v = $('#l-input').value.trim();
  const q = l.qs[l.qi];
  if (!v || !q) { out.innerHTML = ''; return; }
  const i = matchGuess(v, q.answers);
  out.innerHTML = i >= 0 ? `<span class="ok">Matches ${esc(q.answers[i].text)} (${q.answers[i].points})</span>` : '<span class="bad">No match: 0 points</span>';
}

function renderLightningDesk() {
  const l = G.lightning;

/* ---------- Keyboard ---------- */
const keyHooks = [];  // used by Setup Check and settings key capture
function handleKey(e) {
  for (const h of keyHooks.slice()) if (h(e) === true) return true;
  if (SCREEN !== 'game' || !G) return;
  const code = e.code;
  if (code === settings.keys.team1) { Actions.buzz(0); return; }
  if (code === settings.keys.team2) { Actions.buzz(1); return; }
  const dm = /^(Digit|Numpad)([1-8])$/.exec(code);
  if (G.phase === 'lightning') {
    const l = G.lightning;
    if (dm && l.stage === 'playing') { const i = +dm[2] - 1; const q = l.qs[l.qi]; if (q.answers[i]) Lightning.enter(q.answers[i].text, i); return; }
    if (code === 'Space' && l.stage === 'reveal') { e.preventDefault(); Lightning.revealNext(); return; }
    if (code === 'KeyU') { undo(); return; }
    if (code === 'KeyM') { toggleMute(); return; }
    if (code === 'KeyF') { toggleFullscreen(); return; }
    if (code === 'KeyB') { if (!e.fromBoard) Sync.open(); return; }
    return;
  }
  if (dm) { Actions.reveal(+dm[2] - 1); return; }
  switch (code) {
    case 'KeyX': Actions.miss(); break;
    case 'KeyM': toggleMute(); break;
    case 'KeyU': undo(); break;
    case 'KeyN': if (G.phase === 'roundEnd') Actions.next(); break;
    case 'KeyR': if (G.phase === 'roundEnd') Actions.showRest(); break;
    case 'KeyB': if (!e.fromBoard) Sync.open(); break;
    case 'KeyF': toggleFullscreen(); break;
    case 'KeyP': if (G.phase === 'faceoff' && G.round.fo.step === 'playpass') Actions.choose(true); break;
    default: break;
  }
}
document.addEventListener('keydown', (e) => {
  if (IS_BOARD) return;
  // Key capture (buzzer setup) sees every key, including Ctrl, Alt and Command.
  if (keyHooks.length && !modalOpen() && !e.repeat && !(e.target.matches && e.target.matches('input, textarea, select'))) {
    for (const h of keyHooks.slice()) if (h(e) === true) { e.preventDefault(); return; }
  }
  if (e.ctrlKey && e.code === 'KeyZ' && !e.target.matches('input, textarea') && SCREEN === 'game') { e.preventDefault(); undo(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (modalOpen()) return;
  if (e.target.matches && e.target.matches('input, textarea, select, [contenteditable]')) return;
  if (e.code === 'KeyH' && SCREEN === 'game' && deskMode() === 'single') {
    if (!drawerHeld) { drawerHeld = true; updateDrawer(); }
    e.preventDefault();
    return;
  }
  if (e.repeat) return;
  if (e.target.matches && e.target.matches('button, summary, a') && (e.code === 'Space' || e.code === 'Enter')) return;
  if (SCREEN === 'game' && (e.code === 'Space' || /^Shift/.test(e.code))) e.preventDefault();
  handleKey(e);
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'KeyH' && drawerHeld) { drawerHeld = false; updateDrawer(); }
});
window.addEventListener('blur', () => { if (drawerHeld) { drawerHeld = false; updateDrawer(); } });

let SCREEN = 'home';
const Screens = {};

function go(name, arg) {
  if (name === 'game' && !G) name = 'home';
  SCREEN = name;
  keyHooks.length = 0;
  const scr = $('#screen');
  const game = $('#game');
  document.body.dataset.screen = name;
  if (name === 'game') {
    scr.hidden = true;
    scr.innerHTML = '';
    game.hidden = false;
    renderGame();
  } else {
    game.hidden = true;
    scr.hidden = false;
    const s = Screens[name];
    scr.innerHTML = s.html(arg);
    if (s.bind) s.bind(scr, arg);
    window.scrollTo(0, 0);
    const h = scr.querySelector('h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
}
function pageTop(title, sub, back = 'home') {
  return `<div class="pagehead">
    <button type="button" class="btn btn-ghost btn-sm" data-go="${back}">${ICON.back}<span>${back === 'home' ? 'Home' : 'Back'}</span></button>
    <div><h1>${esc(title)}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>
  </div>`;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-go]');
  if (b && !IS_BOARD) { e.preventDefault(); go(b.dataset.go); }
});

function seasonalPack() {
  const m = new Date().getMonth() + 1;
  if (m === 11) return 'thanksgiving';
  if (m === 12) return 'christmas';
  if (m === 1) return 'new-years-eve';
  return 'family-game-night';
}
function packChips(selected, multi, name) {
  return allPacks().filter((p) => playableRounds(p) > 0).map((p) => `
    <label class="pchip"><input type="${multi ? 'checkbox' : 'radio'}" name="${name}" value="${esc(p.id)}" ${selected.includes(p.id) ? 'checked' : ''}>
    <span><b>${esc(p.name)}</b><small>${plural(playableRounds(p), 'question')}${p.source === 'surveyed' ? ' &middot; your crowd' : ''}${!p.builtin && p.source !== 'surveyed' ? ' &middot; custom' : ''}</small></span></label>`).join('');
}

function startGameWith(cfg) {
  if (!newGame(cfg)) return;
  go('game');
  if (G.cfg.screenMode === 'two') Sync.open();
  else toast('One-screen mode. Hold H to see the host panel.');
}

/** Coerce a saved game setup into safe, known values. */
function sanitizeSetup(s) {
  const c = mergeDeep(DEFAULT_CFG, isObj(s) ? s : {});
  const num = (v, def, a, b) => { const n = Math.round(+v); return Number.isFinite(n) ? clamp(n, a, b) : def; };
  const teams = Array.isArray(c.teams) ? c.teams : DEFAULT_CFG.teams;
  c.teams = [0, 1].map((i) => ({
    name: String((teams[i] && teams[i].name) || 'Team ' + (i + 1)).slice(0, 24),
    color: TEAM_COLORS.some((x) => x.id === (teams[i] && teams[i].color)) ? teams[i].color : TEAM_COLORS[i].id,
  }));
  c.packs = (Array.isArray(c.packs) ? c.packs : []).map(String).filter((id) => getPack(id));
  if (!c.packs.length) c.packs = ['family-game-night'];
  c.rounds = num(c.rounds, 5, 1, 20);
  c.winScore = num(c.winScore, 300, 50, 2000);
  c.doubleRound = num(c.doubleRound, 4, 1, 20);
  c.tripleRound = num(c.tripleRound, 5, 1, 20);
  c.doubleOn = !!c.doubleOn;
  c.tripleOn = !!c.tripleOn;
  c.screenMode = c.screenMode === 'single' ? 'single' : 'two';
  return c;
}

  bind(root) {

    on('#st-vol', 'change', () => Sound.play('reveal', true));

    $$('[data-test]', root).forEach((b) => b.addEventListener('click', () => Sound.play(b.dataset.test, true)));
    $$('input[name=st-text]', root).forEach((i) => i.addEventListener('change', () => { settings.textSize = i.value; saveSettings(); }));
    $$('input[name=st-mode]', root).forEach((i) => i.addEventListener('change', () => { settings.screenMode = i.value; saveSettings(); }));

      saveSettings();
    };
    ['#st-lt1', '#st-lt2', '#st-ltg'].forEach((s) => on(s, 'change', saveL));
    $$('[data-key]', root).forEach((b) => b.addEventListener('click', () => {
      if (keyHooks.length) return;
      const n = b.dataset.key;
      const k = $('#st-k' + n);
      k.textContent = 'Press the buzzer now...';
      k.classList.add('listening');
      const hook = (e) => {
        const otherKey = settings.keys['team' + (n === '1' ? 2 : 1)];
        if (e.code === otherKey) { toast('That key is already Team ' + (n === '1' ? 2 : 1) + "'s buzzer. Try another.", 'warn'); return true; }
        if (e.code === 'Escape') { k.textContent = keyLabel(settings.keys['team' + n]); } else {
          settings.keys['team' + n] = e.code;
          saveSettings();
          k.textContent = keyLabel(e.code);
          toast('Team ' + n + ' buzzer set to ' + keyLabel(e.code) + '.');
        }
        k.classList.remove('listening');
        keyHooks.splice(keyHooks.indexOf(hook), 1);
        return true;
      };
      keyHooks.push(hook);
    }));
    on('#st-export', 'click', exportBackup);
    on('#st-import', 'click', importBackup);
    on('#st-reset', 'click', async () => {
      if (!(await confirmBox('Reset everything?', 'This deletes your custom packs, surveys, settings and saved game from this browser. Export a backup first if you want to keep them.', 'Delete and reset', true))) return;
      ['settings', 'packs', 'crowd', 'live', 'liveHist', 'lastSetup', 'tipSeen', 'usedLightning', 'sync'].forEach((k) => Store.del(k));
      settings = deepCopy(DEFAULT_SETTINGS);
      settings.toured = true;
      saveSettings();
      G = null;
      HIST = [];
      Sync.push();
      toast('Everything was reset.');
      go('home');
    });
  },
};
function shortcutsTable() {
  const rows = [
    ['1 to 8', 'Reveal that answer'], ['X', 'Strike (or "not on the board" in a face-off)'], ['U', 'Undo the last action'],
    ['N', 'Next round'], ['M', 'Mute or unmute all sounds'], ['R', 'Show the rest of the answers'], ['B', 'Open the TV board'], ['H (hold)', 'Show the host panel in one-screen mode'],
    ['F', 'Full screen'], [keyLabel(settings.keys.team1) + ' / ' + keyLabel(settings.keys.team2), 'Team 1 / Team 2 buzzers'], ['Space', 'Next reveal in the Lightning Round'],
  ];
  return `<table class="kbd-table"><tbody>${rows.map(([k, v]) => `<tr><td><kbd>${esc(k)}</kbd></td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`;
}
function exportBackup() {
  const data = { app: 'friendly-feud', version: APP_VERSION, exportedAt: new Date().toISOString(), settings, packs: customPacks(), crowd: Store.get('crowd', []), lastSetup: Store.get('lastSetup', null) };
  if (download(fileSlug(BRAND_NAME) + '-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(data, null, 2))) toast('Backup saved to your Downloads folder.');
}
async function importBackup() {
  const f = await pickFile('.json,application/json');
  if (!f) return;
  let data;
  try { data = JSON.parse(f.text); } catch (e) { toast('That file is not a backup file.', 'bad'); return; }
  if (data && Array.isArray(data.rounds)) {
    try { const p = validatePack(data); upsertCustomPack(p); toast('Imported the pack "' + p.name + '".'); } catch (e) { toast(e.message, 'bad'); }
    return;
  }
  if (!data || data.app !== 'friendly-feud') { toast('That file is not a ' + BRAND_NAME + ' backup.', 'bad'); return; }
  let packs = 0;
  (Array.isArray(data.packs) ? data.packs : []).forEach((p) => {
    try {
      const v = validatePack(p);
      if (BUILTIN_PACKS.some((b) => b.id === v.id)) v.id = uid('pack');
      upsertCustomPack(v);
      packs++;
    } catch (e) { /* skip bad pack */ }
  });
  if (Array.isArray(data.crowd)) {
    const cur = Store.get('crowd', []);
    data.crowd.forEach((c) => { if (isObj(c) && c.id && Array.isArray(c.questions)) { c = fixCrowd(Object.assign({}, c, { id: String(c.id).replace(/[^\w-]/g, '').slice(0, 60) || uid('crowd') })); const i = cur.findIndex((x) => x.id === c.id); if (i >= 0) cur[i] = c; else cur.push(c); } });
    Store.set('crowd', cur);
  }
  if (isObj(data.settings)) { settings = sanitizeSettings(data.settings); saveSettings(); }
  if (isObj(data.lastSetup)) Store.set('lastSetup', sanitizeSetup(data.lastSetup));
  toast('Backup imported: ' + plural(packs, 'pack') + ', ' + plural((data.crowd || []).length, 'survey') + '.');
  if (SCREEN === 'settings') go('settings');
}

/* ---------- First-run tour ---------- */
function runTour() {
  const steps = [
    ['#qp', 'Start here', 'Quick Play starts a ready-made game in two clicks.'],
    ['#m-crowd', 'Make it personal', 'Your Crowd turns your guests\' real answers into the board.'],
    ['#m-check', 'Before guests arrive', 'Setup Check tests your TV, sound and buzzers in about a minute.'],
    ['#m-help', 'Need a hand?', 'Help explains the rules and answers common questions.'],
  ];
  let i = 0;
  const wrap = document.createElement('div');
  wrap.className = 'tour';
  wrap.innerHTML = '<div class="tour-hole"></div><div class="tour-tip" role="dialog" aria-modal="true" aria-labelledby="tour-t"><h3 id="tour-t"></h3><p></p><div class="btn-row"><button type="button" class="btn btn-ghost btn-sm" data-t="skip">Skip tour</button><button type="button" class="btn btn-gold btn-sm" data-t="next">Next</button></div></div>';
  document.body.appendChild(wrap);
  const end = () => { wrap.remove(); window.removeEventListener('resize', place); settings.toured = true; saveSettings(); };
  const place = () => {
    const [sel, t, p] = steps[i];
    const el = $(sel);
    if (!el) { end(); return; }
    const r = el.getBoundingClientRect();
    const hole = $('.tour-hole', wrap);
    Object.assign(hole.style, { left: r.left - 8 + 'px', top: r.top - 8 + 'px', width: r.width + 16 + 'px', height: r.height + 16 + 'px' });
    const tip = $('.tour-tip', wrap);
    $('h3', tip).textContent = t;
    $('p', tip).textContent = p;
    $('[data-t=next]', tip).textContent = i === steps.length - 1 ? 'Let\'s play' : 'Next';
    const below = r.bottom + 230 < innerHeight;
    tip.style.top = (below ? r.bottom + 18 : Math.max(12, r.top - 200)) + 'px';
    tip.style.left = clamp(r.left + r.width / 2 - 170, 12, innerWidth - 352) + 'px';
    $('[data-t=next]', tip).focus();
  };
  wrap.addEventListener('click', (e) => {
    const b = e.target.closest('[data-t]');
    if (!b) return;
    if (b.dataset.t === 'skip') end(); else if (++i >= steps.length) end(); else place();
  });
  wrap.addEventListener('keydown', (e) => { if (e.key === 'Escape') end(); });
  window.addEventListener('resize', place);
  place();
}

function bindRoundEditor(p) {
  const save = debounce(() => { upsertCustomPack(p); }, 300);
  $('#ed-name').addEventListener('input', (e) => { p.name = e.target.value.trim() || 'My pack'; save(); });
  $('#ed-aud').addEventListener('input', (e) => { p.audience = e.target.value; save(); });
  const box = $('#ed-rounds');
  box.addEventListener('input', (e) => {
    const card = e.target.closest('[data-ri]');
    if (!card) return;
    const r = p.rounds[+card.dataset.ri];
    if (e.target.classList.contains('red-q')) r.q = e.target.value;
    const tr = e.target.closest('tr[data-ai]');
    if (tr) {
      const a = r.answers[+tr.dataset.ai];
      if (e.target.classList.contains('ra-t')) a.text = e.target.value;
      if (e.target.classList.contains('ra-p')) a.points = clamp(Math.round(+e.target.value || 0), 0, 100);
      if (e.target.classList.contains('ra-a')) a.accept = e.target.value.split(',').map((x) => x.trim()).filter(Boolean);
    }
    // refresh warnings without re-rendering inputs
    const total = r.answers.reduce((s, a) => s + (+a.points || 0), 0);
    const tEl = card.querySelector('.total');
    tEl.textContent = 'Total ' + total + ' of 100';
    tEl.classList.toggle('bad', total > 100);
    card.querySelector('.warns').innerHTML = roundWarnings(r).map((x) => `<span class="warn">${esc(x)}</span>`).join('');
    save();
  });
  box.addEventListener('change', (e) => {
    if (e.target.classList.contains('ra-p')) e.target.closest('[data-ri]').dataset.dirty = '1';
  });
  // Re-sort answers by points only after focus leaves the question card, so typing is never interrupted.
  box.addEventListener('focusout', (e) => {
    const card = e.target.closest('[data-ri]');
    if (!card || !card.dataset.dirty || (e.relatedTarget && card.contains(e.relatedTarget))) return;
    const r = p.rounds[+card.dataset.ri];
    r.answers.sort((x, y) => y.points - x.points);
    upsertCustomPack(p);
    card.outerHTML = roundEditor(r, +card.dataset.ri, p.rounds.length);
    $$(`[data-ri="${card.dataset.ri}"] [data-ed]`, box).forEach((b) => b.addEventListener('click', () => editorAction(b.dataset.ed, p, b)));
  });
}

async function editorAction(a, p, b) {
  const ri = b.dataset.ri != null ? +b.dataset.ri : null;
  const re = () => { upsertCustomPack(p); renderEditorMain(); };
  switch (a) {
    case 'dup': {
      const c = deepCopy(p);
      delete c.builtin;
      c.id = uid('pack');
      c.name = (p.name + ' (my copy)').slice(0, 60);
      upsertCustomPack(c);
      edSel = c.id;
      toast('Made a copy you can edit.');
      go('editor');
      break;
    }
    case 'json': { const c = deepCopy(p); delete c.builtin; download(fileSlug(p.name) + '.json', JSON.stringify(c, null, 2)); break; }
    case 'csv': download(fileSlug(p.name) + '.csv', packToCSV(p), 'text/csv'); break;
    case 'print': printCards(p.rounds, p.name); break;
    case 'play': go('setup', { pack: p.id }); break;
    case 'del':
      if (await confirmBox('Delete "' + p.name + '"?', 'This removes the pack from this browser. Export it first if you want a copy.', 'Delete pack', true)) { deleteCustomPack(p.id); edSel = null; go('editor'); }
      break;
    case 'addq': p.rounds.push({ q: '', answers: [0, 1, 2].map(() => ({ text: '', points: 0, accept: [] })) }); re(); setTimeout(() => { const q = $$('.red-q'); if (q.length) q[q.length - 1].focus(); }, 30); break;
    case 'delq': if (await confirmBox('Remove this question?', esc(p.rounds[ri].q || 'This question') + ' will be removed.', 'Remove')) { p.rounds.splice(ri, 1); re(); } break;
    case 'up': if (ri > 0) { [p.rounds[ri - 1], p.rounds[ri]] = [p.rounds[ri], p.rounds[ri - 1]]; re(); } break;
    case 'down': if (ri < p.rounds.length - 1) { [p.rounds[ri + 1], p.rounds[ri]] = [p.rounds[ri], p.rounds[ri + 1]]; re(); } break;
    case 'adda': if (p.rounds[ri].answers.length < 8) { p.rounds[ri].answers.push({ text: '', points: 0, accept: [] }); re(); } break;
    case 'dela': p.rounds[ri].answers.splice(+b.dataset.ai, 1); re(); break;
    default: break;
  }
}

/* ---------- Parsing ---------- */
const WA_LINE = /^‎?\[?(\d{1,4}[/.-]\d{1,2}[/.-]\d{1,4}),?\s+(\d{1,2}[:.]\d{2}(?:[:.]\d{2})?(?:\s?[AaPp]\.?\s?[Mm]\.?)?)\]?\s*(?:[-–]\s*)?([^:]{1,40}):\s?(.*)$/;
const NAMED_LINE = /^\s*([A-Za-zÀ-ɏ][^:\d\n]{0,30}?)\s*:\s*(.*)$/;

function splitNumbered(body, nQ) {
  // A colon only counts as a delimiter when no digit follows it (so 7:30 stays a time).
  const re = /(?:^|[\s,;])(?:q(?:uestion)?\s*)?(\d{1,2})\s*(?:[.)\]–-]|:(?!\d)|\s-\s)\s*/gi;
  const hits = [];
  let m;
  while ((m = re.exec(body))) hits.push({ n: +m[1], start: m.index, end: m.index + m[0].length });
  const seq = [];
  let last = 0;
  for (let i = 0; i < hits.length; i++) {
    const h = hits[i];
    if (h.n <= last || h.n > nQ) continue;
    // Prefer the very next number. Only skip ahead if the next number never appears later.
    if (h.n !== last + 1 && hits.slice(i + 1).some((x) => x.n === last + 1)) continue;
    seq.push(h);
    last = h.n;
  }
  const out = {};
  seq.forEach((h, i) => {
    const end = i + 1 < seq.length ? seq[i + 1].start : body.length;
    const txt = body.slice(h.end, end).replace(/^[\s,;:.\-–]+|[\s,;]+$/g, '').trim();
    if (txt) out[h.n - 1] = txt;
  });
  return out;
}
function looksLikeQuestions(body, proj) {
  const nb = normalizeAnswer(body);
  let hits = 0;
  proj.questions.forEach((q) => { const nq = normalizeAnswer(q); if (nq.length > 6 && nb.includes(nq)) hits++; });
  return hits >= 2;
}
function parseChat(text, proj) {
  const nQ = proj.questions.length;
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const entries = [];
  let cur = null;
  let anyNamed = false;
  const push = () => { if (cur) entries.push(cur); };
  for (const raw of lines) {
    const line = raw.replace(/‎|‏/g, '');
    let m = WA_LINE.exec(line);
    if (m) { push(); cur = { who: m[3].trim(), body: m[4] }; anyNamed = true; continue; }
    m = NAMED_LINE.exec(line);
    if (m && !/^\s*q?\d/i.test(line) && m[1].trim().split(/\s+/).length <= 4) { push(); cur = { who: m[1].trim(), body: m[2] }; anyNamed = true; continue; }
    if (!line.trim()) { if (!anyNamed && cur) { push(); cur = null; } continue; }
    if (cur) cur.body += '\n' + line; else cur = { who: '', body: line };
  }
  push();
  // Combine messages from the same person
  const byWho = new Map();
  let anon = 0;
  entries.forEach((e) => {
    const key = e.who ? e.who.toLowerCase() : '__anon' + (anon++);
    if (!byWho.has(key)) byWho.set(key, { who: e.who, bodies: [] });
    byWho.get(key).bodies.push(e.body);
  });
  const out = [];
  let guest = 0;
  byWho.forEach((v) => {
    const body = v.bodies.join('\n');
    if (looksLikeQuestions(body, proj)) return;
    let answers = splitNumbered(body, nQ);
    if (!Object.keys(answers).length) {
      const ls = body.split('\n').map((s) => s.trim()).filter(Boolean);
      if (ls.length === nQ) { answers = {}; ls.forEach((s, i) => { answers[i] = s; }); }
    }
    if (!Object.keys(answers).length) return;
    out.push({ who: v.who || 'Guest ' + (++guest), answers });
  });
  return out;
}
function headerScore(h, q) {
  const a = new Set(normalizeAnswer(h).split(' ').filter((w) => w.length > 2));
  const b = normalizeAnswer(q).split(' ').filter((w) => w.length > 2);
  if (!b.length || !a.size) return 0;
  return b.filter((w) => a.has(w)).length / b.length;
}
function csvMapping(header, proj) {
  const used = new Set();
  const skip = (h) => /^(timestamp|email|email address|score)$/i.test(String(h).trim());
  // Only a short "Name" style header is the name column. "Name something..." is a question.
  const whoCol = header.findIndex((h) => /^(name|your name|first name|full name|who|who are you|nickname)\??:?$/i.test(String(h).trim())
    && !proj.questions.some((q) => headerScore(h, q) > 0.5));
  if (whoCol >= 0) used.add(whoCol);
  header.forEach((h, i) => { if (skip(h)) used.add(i); });
  const map = proj.questions.map((q) => {
    let best = -1;
    let bs = 0.5;
    header.forEach((h, i) => { if (used.has(i)) return; const s = headerScore(h, q); if (s > bs) { bs = s; best = i; } });
    if (best >= 0) used.add(best);
    return best;
  });
  // Fill gaps in order with leftover columns
  const left = header.map((_, i) => i).filter((i) => !used.has(i));
  map.forEach((c, qi) => { if (c < 0 && left.length) map[qi] = left.shift(); });
  return { map, whoCol };
}
function parseCSVReplies(rows, mapping) {
  const out = [];
  rows.slice(1).forEach((r, n) => {
    const answers = {};
    mapping.map.forEach((c, qi) => { if (c >= 0 && r[c] && String(r[c]).trim()) answers[qi] = String(r[c]).trim(); });
    if (!Object.keys(answers).length) return;
    out.push({ who: (mapping.whoCol >= 0 && String(r[mapping.whoCol] || '').trim()) || 'Form reply ' + (n + 1), answers });
  });
  return out;
}

/* ---------- Grouping ---------- */
const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function groupKeyFor(R, k) {
  let g = own(R.map, k) ? R.map[k] : k;
  let guard = 0;
  while (own(R.map, g) && R.map[g] !== g && guard++ < 30) g = R.map[g];
  return g;
}
function groupsFor(proj, qi) {
  const R = rulesFor(proj, qi);
  const groups = new Map();
  let respondents = 0;
  proj.responses.forEach((resp) => {
    const raw = resp.answers[qi];
    if (raw == null || !String(raw).trim()) return;
    const clean = String(raw).trim();
    respondents++;
    const k = normalizeAnswer(clean) || clean.toLowerCase();
    const g = groupKeyFor(R, k);
    if (!groups.has(g)) groups.set(g, { key: g, count: 0, raws: {}, members: new Set() });
    const gr = groups.get(g);
    gr.count++;
    gr.raws[clean] = (gr.raws[clean] || 0) + 1;
    gr.members.add(k);
  });
  const all = [...groups.values()].map((g) => {
    const top = Object.entries(g.raws).sort((a, b) => b[1] - a[1])[0][0];
    return { key: g.key, count: g.count, raws: g.raws, members: [...g.members], name: (own(R.names, g.key) && R.names[g.key]) || titleCase(top) };
  }).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  const list = all.filter((g) => !R.deleted.includes(g.key));
  const deleted = all.filter((g) => R.deleted.includes(g.key));
  return { list, deleted, respondents };
}
function fuzzySuggestions(proj, qi, list) {
  const R = rulesFor(proj, qi);
  const out = [];
  const L = list.slice(0, 40);
  for (let i = 0; i < L.length; i++) {
    for (let j = i + 1; j < L.length; j++) {
      const a = L[i].key;
      const b = L[j].key;
      const pair = [a, b].sort().join('|');
      if (R.dismissed.includes(pair)) continue;
      const min = Math.min(a.length, b.length);
      const max = Math.max(a.length, b.length);
      if (min < 3) continue;
      const d = levenshtein(a, b);
      const wordIn = (x, y) => (' ' + y + ' ').includes(' ' + x + ' ');
      if (d <= Math.max(1, Math.floor(max * 0.25)) || (min >= 4 && (wordIn(a, b) || wordIn(b, a)))) out.push([L[i], L[j]]);
      if (out.length >= 6) return out;
    }
  }
  return out;
}
function mergeGroups(proj, qi, intoKey, fromKeys, list) {
  const R = rulesFor(proj, qi);
  fromKeys.forEach((k) => {
    if (k === intoKey) return;
    const g = list.find((x) => x.key === k);
    (g ? g.members : [k]).forEach((m) => { R.map[m] = intoKey; });
    R.map[k] = intoKey;
    delete R.names[k];
  });
  if (R.map[intoKey] === intoKey) delete R.map[intoKey];
}
function splitGroup(proj, qi, g) {
  const R = rulesFor(proj, qi);
  g.members.forEach((m) => { if (groupKeyFor(R, m) === g.key) delete R.map[m]; });
  delete R.map[g.key];
  delete R.names[g.key];
}
function boardFor(proj, qi) {
  const { list, respondents } = groupsFor(proj, qi);
  const top = list.slice(0, 8).map((g) => ({
    text: g.name.slice(0, 40),
    points: respondents ? Math.round((g.count / respondents) * 100) : 0,
    count: g.count,
    accept: [...new Set(Object.keys(g.raws).map((r) => r.toLowerCase()).filter((r) => r !== g.name.toLowerCase()))].slice(0, 12),
  }));
  return { answers: top, respondents };
}

      ${mode === 'csv' ? `<p class="hint">Download the responses from Google Forms as a .csv file, then open it here. Or paste the CSV text.</p>

        <textarea id="cr-paste" rows="8" placeholder="Timestamp,Name something the bride always says,..."></textarea>

        <textarea id="cr-paste" rows="10" placeholder="Wine&#10;Champagne&#10;wine!!"></textarea>

function addReplies(proj, list) {
  let added = 0;
  let updated = 0;
  let skipped = 0;
  list.forEach((r) => {
    const answers = {};
    Object.entries(r.answers).forEach(([k, v]) => { if (String(v || '').trim()) answers[k] = String(v).trim(); });
    if (!Object.keys(answers).length) return;
    if (r.single) { proj.responses.push({ id: uid('resp'), who: r.who, answers }); added++; return; }
    const who = String(r.who || '').trim();
    const ex = who && !/^(guest|form reply|answer) \d+$/i.test(who) ? proj.responses.find((x) => x.who.toLowerCase() === who.toLowerCase()) : null;
    if (ex) {
      const before = JSON.stringify(ex.answers);
      Object.assign(ex.answers, answers);
      if (JSON.stringify(ex.answers) === before) skipped++; else updated++;
    } else {
      const sig = JSON.stringify(answers);
      if (proj.responses.some((x) => JSON.stringify(x.answers) === sig && x.who === who)) { skipped++; return; }
      proj.responses.push({ id: uid('resp'), who: who || 'Guest ' + (proj.responses.length + 1), answers });
      added++;
    }
  });
  return { added, updated, skipped };
}

function renderGroupStep(proj, body) {
  const qi = clamp(crowdState.qi, 0, proj.questions.length - 1);
  crowdState.qi = qi;
  const { list, deleted, respondents } = groupsFor(proj, qi);
  const sugg = fuzzySuggestions(proj, qi, list);
  body.innerHTML = `<div class="card">
      <div class="qtabs" role="tablist">${proj.questions.map((q, i) => `<button type="button" role="tab" aria-selected="${i === qi}" data-gq="${i}" title="${esc(q)}">Q${i + 1}</button>`).join('')}</div>
      <h2>${qi + 1}. ${esc(proj.questions[qi])}</h2>
      <p class="big-stat"><b>${respondents}</b> ${respondents === 1 ? 'person' : 'people'} answered</p>
      ${sugg.length ? `<div class="sugg"><h3>Same thing?</h3>${sugg.map(([a, b], i) => `<div class="sugg-row"><span>"${esc(a.name)}" and "${esc(b.name)}"</span><button type="button" class="btn btn-gold btn-sm" data-sm="${i}">Merge</button><button type="button" class="btn btn-ghost btn-sm" data-sk="${i}">Keep separate</button></div>`).join('')}</div>` : ''}
      <p class="hint">Tick two or more answers and click Merge to count them as one. Click a name to rename it. Merges are remembered when you add late replies.</p>
      <div class="btn-row"><button type="button" class="btn btn-sm" id="g-merge" disabled>Merge selected</button></div>
      <ul class="groups">${list.map((g, i) => `<li class="${i < 8 ? 'top' : ''}">
        <input type="checkbox" data-gsel="${esc(g.key)}" aria-label="Select ${esc(g.name)}">
        <button type="button" class="g-name" data-gren="${esc(g.key)}" title="Rename">${esc(g.name)}</button>
        <span class="g-count">${g.count}</span>
        <span class="g-raw">${Object.keys(g.raws).length > 1 ? esc(Object.keys(g.raws).join(', ')) : ''}</span>
        ${g.members.length > 1 ? `<button type="button" class="btn btn-ghost btn-sm" data-gsplit="${esc(g.key)}">Split</button>` : ''}
        <button type="button" class="btn btn-ghost btn-sm" data-gdel="${esc(g.key)}">Delete</button></li>`).join('')}</ul>
      ${deleted.length ? `<details><summary>Deleted answers (${deleted.length})</summary><ul class="groups">${deleted.map((g) => `<li><span class="g-name">${esc(g.name)}</span><span class="g-count">${g.count}</span><button type="button" class="btn btn-ghost btn-sm" data-gres="${esc(g.key)}">Restore</button></li>`).join('')}</ul></details>` : ''}
    </div>${crowdNav(2, 4, 'Next: see the board')}`;
  const R = rulesFor(proj, qi);
  const redo = () => { crowdSave(proj); renderCrowdStep(); };
  $$('[data-gq]', body).forEach((b) => b.addEventListener('click', () => { crowdState.qi = +b.dataset.gq; renderCrowdStep(); }));
  $$('[data-sm]', body).forEach((b) => b.addEventListener('click', () => { const [a, c] = sugg[+b.dataset.sm]; mergeGroups(proj, qi, a.key, [c.key], list); redo(); }));
  $$('[data-sk]', body).forEach((b) => b.addEventListener('click', () => { const [a, c] = sugg[+b.dataset.sk]; R.dismissed.push([a.key, c.key].sort().join('|')); redo(); }));
  const sel = () => $$('[data-gsel]', body).filter((c) => c.checked).map((c) => c.dataset.gsel);
  $$('[data-gsel]', body).forEach((c) => c.addEventListener('change', () => { $('#g-merge').disabled = sel().length < 2; }));
  $('#g-merge').addEventListener('click', () => {
    const keys = sel();
    const into = list.find((g) => keys.includes(g.key)).key;
    mergeGroups(proj, qi, into, keys, list);
    toast('Merged.');
    redo();
  });
  $$('[data-gren]', body).forEach((b) => b.addEventListener('click', async () => {
    const g = list.find((x) => x.key === b.dataset.gren);
    let val = g.name;
    const v = await modal({
      title: 'Rename answer',
      body: `<label class="fld">Show on the board as<input id="g-ren" type="text" maxlength="40" value="${esc(g.name)}" autofocus></label>`,
      actions: [{ label: 'Cancel', value: null }, { label: 'Save', primary: true, value: 'ok', validate: (w) => { val = w.querySelector('#g-ren').value.trim(); return !!val; } }],
    });
    if (v === 'ok') { R.names[g.key] = val; redo(); }
  }));
  $$('[data-gsplit]', body).forEach((b) => b.addEventListener('click', () => { splitGroup(proj, qi, list.find((x) => x.key === b.dataset.gsplit)); redo(); }));
  $$('[data-gdel]', body).forEach((b) => b.addEventListener('click', () => { R.deleted.push(b.dataset.gdel); redo(); }));
  $$('[data-gres]', body).forEach((b) => b.addEventListener('click', () => { R.deleted = R.deleted.filter((k) => k !== b.dataset.gres); redo(); }));
}

function crowdPack(proj) {
  const rounds = [];
  proj.questions.forEach((q, qi) => {
    const b = boardFor(proj, qi);
    if (b.answers.length >= 3) rounds.push({ q, answers: b.answers.map((a) => ({ text: a.text, points: a.points, accept: a.accept })) });
  });
  return { id: 'crowd-' + proj.id.replace(/^crowd-/, ''), name: proj.name.slice(0, 60), audience: 'Our guests', region: 'US', source: 'surveyed', rounds, lightning: [] };
}

function renderBoardStep(proj, body) {
  const boards = proj.questions.map((q, qi) => ({ q, ...boardFor(proj, qi) }));
  const packId = 'crowd-' + proj.id.replace(/^crowd-/, '');
  const saved = !!customPacks().find((p) => p.id === packId);
  body.innerHTML = `<div class="card">
      <h2>Your boards</h2>
      <p class="hint">Points = how many people gave that answer, out of everyone who answered. Each board shows the top 8.</p>
      <div class="btn-row">
        <label class="toggle"><input type="checkbox" id="cr-lock" ${proj.locked ? 'checked' : ''}><span>Lock board (no more changes)</span></label>
      </div>
      <div class="btn-row">
        <button type="button" class="btn btn-gold btn-big" id="cr-save">${saved ? 'Update the pack' : 'Save as a pack'}</button>
        <button type="button" class="btn" id="cr-play" ${saved ? '' : 'disabled'}>Play with this pack</button>
        <button type="button" class="btn" id="cr-json">Export JSON</button>
        ${proj.locked ? '' : '<button type="button" class="btn btn-ghost" data-cstep="2">Add more replies</button>'}
      </div>
    </div>
    <div class="cr-boards">${boards.map((b, i) => `<div class="card cr-board"><h3>${i + 1}. ${esc(b.q)}</h3><p class="hint">${b.respondents} ${b.respondents === 1 ? 'person' : 'people'} answered</p>
      ${b.answers.length < 3 ? '<p class="warn">Needs at least 3 different answers to play.</p>' : ''}
      <ol class="mini-board">${b.answers.map((a) => `<li><span>${esc(a.text)}</span><b>${a.points}</b></li>`).join('')}</ol></div>`).join('')}</div>
    ${crowdNav(3, null)}`;
  $('#cr-lock').addEventListener('change', (e) => { proj.locked = e.target.checked; crowdSave(proj); renderCrowdStep(); });
  $('#cr-save').addEventListener('click', () => {
    const p = crowdPack(proj);
    if (!p.rounds.length) { toast('No question has 3 answers yet. Add more replies first.', 'warn'); return; }
    upsertCustomPack(p);
    toast('Saved "' + p.name + '" with ' + plural(p.rounds.length, 'question') + '.');
    renderCrowdStep();
  });
  $('#cr-play').addEventListener('click', () => go('setup', { pack: packId }));
  $('#cr-json').addEventListener('click', () => download(fileSlug(proj.name) + '-pack.json', JSON.stringify(crowdPack(proj), null, 2)));
}

/* ---- main.js ---- */
/* =========================================================
   Start-up
   ========================================================= */
function startHost() {
  document.title = BRAND_NAME;
  applyDisplay(displaySettings());
  mountGame();
  Sync.initHost();
  document.addEventListener('pointerdown', () => Sound.ensure(), { once: true });
  document.addEventListener('keydown', () => Sound.ensure(), { once: true });

  // Pick up where you left off?
  const live = Store.get('live', null);
  go('home');
  if (live && live.round && live.phase !== 'gameOver' && live.v === 1) {
    const sum = `Round ${live.roundNo}: ${esc(live.teams[0].name)} ${live.teams[0].score}, ${esc(live.teams[1].name)} ${live.teams[1].score}.`;
    modal({
      title: 'Pick up where you left off?',
      body: `<p>You have a game in progress.</p><p><b>${sum}</b></p>`,
      actions: [{ label: 'Start fresh', value: 'fresh' }, { label: 'Resume game', primary: true, value: 'resume' }],
      dismissible: false,
    }).then((v) => {
      if (v === 'resume') {
        G = live;
        G.fx = null;
        if (G.lightning) G.lightning.running = false;
        const h = Store.get('liveHist', []);
        HIST = Array.isArray(h) ? h : [];
        go('game');
        Sync.push();
        if (G.cfg.screenMode === 'two' && !Sync.isOpen()) toast('Click Reopen at the top to bring back the TV board.');
      } else {
        G = null;
        HIST = [];
        persistLive();
        Sync.push();
        if (!settings.toured) runTour();
      }
    });
    settings.toured = settings.toured || false;
  }
  // Keep the board in step with display settings changed in another tab
  window.addEventListener('storage', (e) => {
    if (e.key === 'ff.settings' && e.newValue) {
      try { settings = sanitizeSettings(JSON.parse(e.newValue)); applyDisplay(displaySettings()); } catch (err) { /* ignore */ }
    }
  });
  window.__ff = { get G() { return G; }, Actions, Lightning, Clock, go, get SCREEN() { return SCREEN; }, Sync, t: { normalizeAnswer, matchGuess, splitNumbered, csvMapping, parseChat, removeCrowdQuestion, fixCrowd, groupsFor, sanitizeSettings, freshCount, playedList } };
}

window.addEventListener('error', (e) => {
  // Never show a broken screen at a party. Log quietly and keep going.
  try { console.warn('[' + BRAND_NAME + ']', e.message); } catch (err) { /* ignore */ }
});

if (IS_BOARD) startBoardWindow(); else startHost();

})();
</script>
